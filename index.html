kids:[
{title:T('DNA-Detektiv','DNA detective'),q:T('Tippe auf das Bild mit der verdrehten Doppel-Leiter.','Tap the picture that shows the twisted double ladder.'),scene:'molecule',options:[{icon:'💧'},{icon:'🧬'},{icon:'🪨'}],ans:1,h:T('DNA sieht oft wie eine gedrehte Leiter aus.','DNA often resembles a twisted ladder.'),why:T('Das Bild zeigt eine Doppelhelix: die typische vereinfachte Darstellung der DNA.','This icon shows a double helix, the familiar simplified representation of DNA.')},
{title:T('Atom-Baumeister','Atom builder'),q:T('Welches Bild stellt eine Kette aus verbundenen Bausteinen dar?','Which picture shows a chain of connected building blocks?'),scene:'protein',options:[{icon:'⚪'},{icon:'🔴—🟡—🔵'},{icon:'🟦'}],ans:1,h:T('Die Kugeln sollen miteinander verbunden sein.','Look for connected spheres.'),why:T('Moleküle bestehen aus Atomen, die miteinander verbunden sein können.','Molecules contain atoms that can be bonded to each other.')},
{title:T('Wer passt durchs Loch?','Who fits through the hole?'),q:T('Die Öffnung ist 6 Felder breit. Welcher starre Ball mit weniger als 6 Feldern passt sicher hindurch?','The opening is 6 units wide. Which rigid ball smaller than 6 units fits through?'),scene:'pore',options:[{icon:'🔵',label:T('3 Felder','3 units')},{icon:'🟠',label:T('8 Felder','8 units')},{icon:'🟣',label:T('10 Felder','10 units')}],ans:0,h:T('Vergleiche die Breite der Öffnung und des Balls.','Compare the widths of the opening and ball.'),why:T('Im einfachen Modell passt ein starrer Ball mit 3 Feldern durch eine 6 Felder breite Öffnung.','In this simple model a 3-unit rigid ball fits through a 6-unit opening.')},

{title:T('Nanoporen-Labor','Nanopore lab'),q:T('Wähle eine Pore für ein starres Teilchen mit 4 nm Durchmesser: groß genug, aber nicht unnötig riesig.','Choose a pore for a rigid 4 nm particle: large enough, but not unnecessarily huge.'),scene:'pore',options:[{icon:'🔵',label:'3 nm'},{icon:'🟢',label:'5 nm'},{icon:'🟣',label:'15 nm'}],ans:1,h:T('Die Öffnung muss größer als 4 nm sein.','The opening must exceed 4 nm.'),why:T('In diesem geometrischen Modell sind 5 nm passend. Reale Moleküle können deformierbar sein und mit der Pore wechselwirken.','5 nm works in this geometric model. Real molecules may deform or interact with the pore.')},
{title:T('Strom-Detektiv','Current detective'),q:T('Ohne Molekül: 100 pA. Mit Molekül: 70 pA. Wie stark sinkt der Strom?','Without molecule: 100 pA. With molecule: 70 pA. How much does the current drop?'),scene:'signal',options:[{icon:'⚡',label:'30 pA'},{icon:'⚡',label:'70 pA'},{icon:'⚡',label:'170 pA'}],ans:0,h:T('Ziehe 70 von 100 ab.','Subtract 70 from 100.'),why:T('Die Blockade-Amplitude ist 100 − 70 = 30 pA.','The blockade amplitude is 100 − 70 = 30 pA.')},
{title:T('Elektrisches Feld','Electric-field challenge'),q:T('Stelle die Spannung so ein, dass die vereinfachte Geschwindigkeitsanzeige zwischen 3 und 4 liegt.','Adjust the voltage so the simplified speed indicator is between 3 and 4.'),scene:'pore',type:'slider',min:20,max:120,step:5,start:30,unit:'mV',lo:60,hi:80,formula:v=>(v/20).toFixed(1)+' ×',h:T('Im Modell wächst der Anzeigewert mit der Spannung.','In this model the indicator increases with voltage.'),why:T('Das ist ein Spielmodell, keine allgemeingültige Vorhersage echter Translokationsgeschwindigkeiten.','This is a game model, not a general prediction of real translocation speed.')},

{title:T('PINN: Wissen plus Daten','PINN: physics plus data'),q:T('Welche Zusatzinformation unterscheidet einen physics-informed Ansatz hier von rein datengetriebenem Training?','What additional information distinguishes physics-informed training here from purely data-driven training?'),scene:'pinn',options:[{icon:'📐',label:T('Physikalische Gleichungen oder Nebenbedingungen','Physical equations or constraints')},{icon:'🖼️',label:T('Nur größere Bilder','Only larger images')},{icon:'🎲',label:T('Zufällige Labels','Random labels')}],ans:0,h:T('Neben Messdaten gibt es bekannte Naturgesetze.','Besides data, we may know physical laws.'),why:T('Physics-informed Modelle integrieren physikalische Information, etwa über einen zusätzlichen Fehlerterm.','Physics-informed models incorporate physical information, for example through an additional loss term.')},
{title:T('PINN-Gewichte abstimmen','Tune PINN weighting'),q:T('Stelle in unserem rein illustrativen Modell das Gewicht so ein, dass sich Daten- und Physikfehler sinnvoll ausgleichen (Ziel: 40–60 %).','Adjust the weight in this illustrative model to balance data and physics penalties (target: 40–60%).'),scene:'pinn',type:'slider',min:0,max:100,step:5,start:0,unit:'%',lo:40,hi:60,formula:v=>v+' % physics',h:T('Zu starke Gewichtung einer Seite kann die andere vernachlässigen.','Overweighting one side can neglect the other.'),why:T('In echten PINNs wird die Gewichtung anhand von Daten, physikalischem Modell und Validierung optimiert; 50 % ist keine allgemeine Regel.','Real PINN weights require tuning using data, physics, and validation; 50% is not a universal optimum.')},

function scene(k){let b='<svg viewBox="0 0 720 190" role="img" aria-label="Science illustration"><rect width="720" height="190" fill="#0b223d"/>';let a='';if(k==='molecule')a='<text x="270" y="129" font-size="108">🧬</text>';else if(k==='protein'||k==='atoms')a=Array.from({length:12},(_,i)=>`<line x1="${50+i*51}" y1="${85+30*Math.sin(i)}" x2="${101+i*51}" y2="${85+30*Math.sin(i+1)}" stroke="#ffda86" stroke-width="7"/><circle cx="${50+i*51}" cy="${85+30*Math.sin(i)}" r="17" fill="${['#82d8ff','#c3a8ff','#79eed3'][i%3]}"/>`).join('');else if(k==='pore')a='<rect x="325" y="0" width="65" height="58" rx="8" fill="#ae99f3"/><rect x="325" y="126" width="65" height="64" rx="8" fill="#ae99f3"/><circle cx="230" cy="91" r="30" fill="#ffda86"/><path d="M260 91 H510 l-20 -14 m20 14 l-20 14" stroke="#79eed3" stroke-width="5" fill="none" stroke-dasharray="9 7"/>';else if(k==='signal')a='<path d="M20 42 H165 V140 H315 V42 H450 V110 H565 V42 H700" stroke="#79eed3" stroke-width="6" fill="none"/><path d="M0 42 H720 M0 100 H720 M0 150 H720" stroke="#295171" fill="none"/>';else if(k==='music')a='<text x="110" y="128" font-size="87">🎶</text><text x="410" y="128" font-size="87">🤖</text>';else if(k==='cold')a='<text x="140" y="130" font-size="96">❄️</text><text x="450" y="130" font-size="96">⚡</text>';else if(k==='knn')a='<path d="M110 20 V160 H600" stroke="#bcd9e8" stroke-width="4" fill="none"/>'+[[400,53,'#7aebc9'],[456,75,'#7aebc9'],[510,52,'#7aebc9'],[190,119,'#ffab9e'],[234,139,'#ffab9e'],[270,114,'#ffab9e']].map(([x,y,c])=>`<circle cx="${x}" cy="${y}" r="12" fill="${c}"/>`).join('')+'<text x="467" y="115" font-size="35" fill="#ffda86">★</text>';else if(k==='pinn')a='<rect x="80" y="45" width="170" height="95" rx="12" stroke="#79eed3" fill="#14425d"/><text x="103" y="102" fill="white" font-size="25">DATA</text><rect x="470" y="45" width="170" height="95" rx="12" stroke="#c2a8ff" fill="#14425d"/><text x="487" y="102" fill="white" font-size="25">PHYSICS</text><path d="M258 90 H459" stroke="#ffd888" stroke-width="6" stroke-dasharray="12 7"/>';else if(k==='density')a=Array.from({length:90},(_,i)=>{let x=25+(i*71%670),y=20+(i*37%150),c=x<350?'#ef827c':'#7ad1ff';return `<circle cx="${x}" cy="${y}" r="${3+(i%4)}" fill="${c}" opacity=".65"/>`}).join('');return b+a+'</svg>'}
function shell(body){let u=UI[lang];document.documentElement.lang=lang;app.innerHTML=`<header><div class="logo">⚛ Nano<b>Quest</b></div><div class="langs"><button data-lang="de" class="${lang==='de'?'on':''}" aria-pressed="${lang==='de'}">DE</button><button data-lang="en" class="${lang==='en'?'on':''}" aria-pressed="${lang==='en'}">EN</button></div></header>${body}<div class="footer">${u.foot}</div>`}
function home(){group=null;let u=UI[lang];shell(`<main class="panel"><div class="eyebrow">${u.tag}</div><h1>${u.title}</h1><p class="lead">${u.intro}</p><div class="chips"><span class="chip">DE / EN</span><span class="chip">21 ${lang==='de'?'Missionen':'missions'}</span><span class="chip">3 ${lang==='de'?'Altersgruppen':'age groups'}</span><span class="chip">iPad</span></div><h2>${u.choose}</h2><div class="agegrid">${ages.map((a,i)=>`<button class="age" data-age="${a.id}"><span class="emoji">${a.emoji}</span><strong>${u.ages[i]}</strong><span class="chip">${a.age}</span><span>${u.desc[i]} · 7 ${u.mission.toLowerCase()}s</span></button>`).join('')}</div></main>`)}
function option(o,i){let label=tx(o.label),vis=o.trace?trace(o.trace):`<span class="big">${o.icon||''}</span>`;return `<button class="opt" data-option="${i}" aria-pressed="false" aria-label="${esc(label||(lang==='de'?'Bild ':'Image ')+(i+1))}">${vis}${label?`<span class="sm">${esc(label)}</span>`:''}</button>`}
function render(){let u=UI[lang],t=Q[group]?.[idx];if(!t)return end();let age=ages.findIndex(a=>a.id===group);sel=-1;finished=false;tries=0;slider=t.start||0;let activity=t.type==='slider'?`<div class="meter"><span>${u.units}</span><output id="val">${slider} ${t.unit}</output></div><input class="slider" id="range" type="range" min="${t.min}" max="${t.max}" step="${t.step}" value="${slider}"><div class="stats"><div>${lang==='de'?'Modellwert':'Model value'}<div id="result" class="value">${t.formula(slider)}</div></div><div>${u.goal}<div class="value">${t.lo}–${t.hi} ${t.unit}</div></div></div>`:`<div class="opts">${t.options.map(option).join('')}</div>`;shell(`<div class="nav"><button class="btn alt" data-act="home">${u.back}</button><span class="chip">${u.ages[age]} · ${u.mission} ${idx+1}/7</span><span class="chip">⭐ ${score}</span><div class="progress"><span style="width:${idx/7*100}%"></span></div></div><main class="panel"><div class="eyebrow">${u.mission} ${idx+1} / 7</div><h2>${tx(t.title)}</h2><p class="lead">${tx(t.q)}</p><div class="scene">${scene(t.scene)}${activity}</div><div class="actions"><button class="btn" data-act="check">${u.check}</button><button class="btn alt" data-act="hint">💡 ${u.hint}</button></div><div class="feedback" id="fb" role="status" aria-live="polite">${u.start}</div></main>`)}
function fb(s,sty=''){let e=app.querySelector('#fb');if(e){e.className='feedback '+sty;e.textContent=s}}
function check(){let u=UI[lang],t=Q[group][idx];if(finished)return;if(t.type!=='slider'&&sel<0){fb(u.chooseOne,'bad');return}let ok=t.type==='slider'?slider>=t.lo&&slider<=t.hi:sel===t.ans;tries++;if(!ok){fb(u.tryAgain,'bad');return}finished=true;let n=tries===1?100:70;score+=n;fb('✅ '+u.correct+' +'+n+' '+u.points+'. '+tx(t.why),'good');app.querySelector('.actions').innerHTML=`<button class="btn" data-act="next">${idx===6?u.finish:u.next}</button>`;app.querySelectorAll('[data-option]').forEach(x=>x.disabled=true)}
function end(){let u=UI[lang];shell(`<main class="panel" style="text-align:center"><div class="banner">🏆🧬✨</div><h1>${u.done}</h1><div class="value">${score} / 700 ${u.points}</div><p>${lang==='de'?'Du hast Forschungsideen mit kleinen Experimenten entdeckt.':'You explored research ideas through small experiments.'}</p><div class="actions" style="justify-content:center"><button class="btn" data-act="replay">↻ ${u.replay}</button><button class="btn alt" data-act="home">${u.change}</button></div></main>`)}
app.addEventListener('click',ev=>{let b=ev.target.closest('[data-lang],[data-age],[data-option],[data-act]');if(!b)return;if(b.dataset.lang){let keep=Number(b.dataset.lang===lang);if(keep)return;lang=b.dataset.lang;if(group===null)home();else if(idx>=7)end();else render();return}if(b.dataset.age){group=b.dataset.age;idx=0;score=0;render();return}if(b.dataset.option!==undefined){if(finished)return;sel=Number(b.dataset.option);app.querySelectorAll('[data-option]').forEach(x=>{let active=+x.dataset.option===sel;x.classList.toggle('selected',active);x.setAttribute('aria-pressed',String(active))});return}switch(b.dataset.act){case'home':home();break;case'hint':fb(tx(Q[group][idx].h));break;case'check':check();break;case'next':idx++;render();break;case'replay':idx=0;score=0;render();break}});
app.addEventListener('input',ev=>{if(ev.target.id==='range'){slider=+ev.target.value;let t=Q[group][idx];app.querySelector('#val').textContent=slider+' '+t.unit;app.querySelector('#result').textContent=t.formula(slider)}});home();})();
</script></body></html>
