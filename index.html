<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#071525"><title>NanoQuest · Science Night</title><style>
:root{color-scheme:dark;--bg:#071525;--surface:#102b43;--surface2:#173b55;--line:#456981;--txt:#f3f9ff;--muted:#c5dbe9;--mint:#75f0ce;--amber:#ffdb8a;--pink:#e3a5ff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#1d4d72,#071525 68%);color:var(--txt);font:17px/1.5 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh}button,input{font:inherit}button{touch-action:manipulation;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:3px}.wrap{width:min(1080px,100%);padding:18px clamp(14px,3vw,30px);margin:auto}header{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.brand{font-size:clamp(27px,4vw,35px);font-weight:950;letter-spacing:-1px}.brand span{color:var(--mint)}.langbar{display:flex;gap:5px;border:1px solid var(--line);padding:5px;border-radius:14px;background:#122e47}.langbar button{padding:9px 16px;background:none;border:0;border-radius:10px;color:white;font-weight:900}.langbar button.on{background:var(--mint);color:#092238}.panel{border:1px solid var(--line);background:linear-gradient(125deg,#163954,#0c2339);border-radius:24px;padding:clamp(18px,4vw,32px);box-shadow:0 22px 50px #0003}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:12px;font-weight:900;color:var(--mint)}h1{font-size:clamp(31px,5.5vw,56px);line-height:1.07;letter-spacing:-.04em;margin:12px 0}h2{font-size:clamp(24px,4vw,35px);line-height:1.2;margin:10px 0 16px}.lead{font-size:clamp(17px,2.2vw,20px);color:#e1f0f8;max-width:850px}.muted{color:var(--muted)}.tracks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:25px}.track{background:var(--surface);border:2px solid var(--line);border-radius:20px;text-align:left;padding:22px;min-height:225px;color:white;display:flex;flex-direction:column;gap:12px}.track:hover,.track:focus-visible,.opt.selected{border-color:var(--mint);background:#225167}.track .emoji{font-size:46px}.track strong{font-size:24px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#27516a;border:1px solid #476e83;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:850}.btn{border:1px solid transparent;background:var(--mint);color:#092538;padding:13px 20px;border-radius:14px;min-height:50px;font-weight:850}.btn.secondary{background:#244c67;border-color:#50778d;color:white}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.headrow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.bar{width:min(200px,33vw);height:10px;background:#37546a;border-radius:99px;overflow:hidden}.bar div{height:100%;background:var(--mint)}.scene{background:#0a2036;border:1px solid #41657e;border-radius:18px;padding:clamp(13px,3vw,22px);margin-top:17px}.diagram{display:block;width:100%;max-height:230px;border-radius:12px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:18px}.opt{min-height:130px;background:#163752;border:2px solid #55738e;color:white;border-radius:18px;padding:12px 9px;font-weight:750;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;text-align:center}.opt svg{width:100%;max-width:150px;max-height:88px}.opt .em{font-size:46px;line-height:1.2}.opt .lab{font-size:clamp(13px,1.75vw,17px);line-height:1.25}.message{border:1px solid #526f83;border-radius:14px;background:#1b3c54;padding:15px;margin-top:18px;min-height:60px}.message.yes{background:#164942;border-color:var(--mint)}.message.no{border-color:var(--amber)}.meter{display:flex;justify-content:space-between;align-items:center;font-weight:800;gap:10px}.range{width:100%;height:45px;accent-color:var(--mint)}.num{font-size:30px;font-weight:900;color:var(--mint)}.tile{background:#143b55;padding:13px;border:1px solid #426c83;border-radius:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.graph{height:235px;width:100%;display:block}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#d7e9f4;margin-top:7px}.dot{width:12px;height:12px;display:inline-block;border-radius:50%;margin-right:5px;vertical-align:middle}.sequence{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.step{padding:10px 12px;background:#1a4b65;border:1px solid #587e94;border-radius:11px;font-weight:800;font-size:14px}.callout{background:#14354f;border-left:4px solid var(--mint);padding:14px;border-radius:9px;margin:18px 0;color:#e9f4fb}.foot{text-align:center;color:#b5cedf;font-size:12px;padding:22px 0}button:disabled{opacity:.72;cursor:default}@media(max-width:700px){.tracks{grid-template-columns:1fr}.track{min-height:125px}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.opt{min-height:118px}.two{grid-template-columns:1fr}.graph{height:210px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap" id="app"></div><script>
(()=>{'use strict';const app=document.getElementById('app');let lang='de',track=null,idx=0,answer=-1,tries=0,score=0,done=false,slider=0,awarded=new Set();const tr=(de,en)=>({de,en});const tx=x=>typeof x==='string'?x:(x?.[lang]||'');const U={de:{subtitle:'Entdecke die Forschung hinter unseren Postern',hero:'Winzige Strukturen. Große Entdeckungen.',intro:'Erkunde echte Themen aus unseren Science-Night-Postern: Moleküle, Nanoporen, Computer-Simulationen, Machine Learning, AlphaFold und Physik im KI-Modell.',pick:'Wähle dein Abenteuer',a:'Entdecker',b:'Forschungslabor',ad:'8–12 Jahre · Bilder, Muster und einfache Experimente',bd:'13+ und Erwachsene · Daten, Modelle und Forschungsentscheidungen',play:'Abenteuer starten',back:'← Alterswahl',task:'Mission',hint:'💡 Tipp',check:'Antwort prüfen',next:'Nächste Mission →',results:'Ergebnis ansehen →',choose:'Wähle eine Antwort.',try:'Fast! Schau genauer hin und versuche es erneut.',correct:'Sehr gut!',points:'Punkte',finish:'Mission erfüllt!',restart:'Nochmal spielen',other:'Andere Gruppe',foot:'Interaktive Lernmodelle auf Grundlage der ausgestellten Poster; keine experimentellen Echtzeitdaten. Keine Anmeldung, keine Werbung, keine Nutzerdatenerfassung.',explain:'Was wir daraus lernen:',demo:'Vereinfachtes Modell',target:'Zielbereich',voltage:'Eingestellte Spannung',new:'Ein neuer Song',liked:'Gefällt',notLiked:'Gefällt nicht',match:'Welcher Gruppe gehört der gelbe Punkt?',observe:'Beobachte die Punkte: Grün = gefällt, Rot = gefällt nicht.',snapshot:'Die Grafik zeigt ein Lernbeispiel, keine echten Musikdaten.'},en:{subtitle:'Explore the research behind our posters',hero:'Tiny structures. Big discoveries.',intro:'Explore real topics from our Science Night posters: molecules, nanopores, computer simulations, machine learning, AlphaFold, and physics-informed AI.',pick:'Choose your adventure',a:'Explorers',b:'Research Lab',ad:'Ages 8–12 · Images, patterns, simple experiments',bd:'Ages 13+ and adults · Data, models, research decisions',play:'Start adventure',back:'← Age selection',task:'Mission',hint:'💡 Hint',check:'Check answer',next:'Next mission →',results:'See results →',choose:'Choose an answer.',try:'Almost! Look more closely and try again.',correct:'Great!',points:'points',finish:'Mission complete!',restart:'Play again',other:'Other group',foot:'Interactive teaching models based on the exhibition posters; not live experimental data. No login, ads, or visitor tracking.',explain:'What we learned:',demo:'Simplified model',target:'Target range',voltage:'Applied voltage',new:'A new song',liked:'Like',notLiked:'Dislike',match:'Which group is the yellow point closer to?',observe:'Look at the points: Green = like, Red = dislike.',snapshot:'This is a learning example, not actual music data.'}};
const tasks={kids:[
{id:'dna',topic:'molecules',title:tr('Entdecke die DNA','Find DNA'),q:tr('Welches Bild zeigt die verdrehte DNA-Leiter?','Which picture shows the twisted DNA ladder?'),kind:'choose',choices:[{pic:'dna'},{pic:'sphere'},{pic:'water'}],correct:0,hint:tr('Achte auf zwei Stränge, die sich umeinander winden.','Look for two strands twisting around one another.'),why:tr('DNA speichert unsere Erbinformation und wird oft als Doppelhelix gezeichnet.','DNA stores genetic information and is often drawn as a double helix.')},
{id:'proteins',topic:'molecules',title:tr('Bausteine eines Proteins','Building a protein'),q:tr('Welches Bild zeigt mehrere Bausteine, die zu einer Kette verbunden sind?','Which image shows building blocks joined into a chain?'),kind:'choose',choices:[{pic:'dots'},{pic:'chain'},{pic:'cube'}],correct:1,hint:tr('Suche die Bausteine, die miteinander verbunden sind.','Find the building blocks connected to each other.'),why:tr('Proteine bestehen aus Aminosäureketten, die sich anschließend falten können.','Proteins are amino-acid chains that can subsequently fold.')},
{id:'crowd',topic:'density',title:tr('Wo ist die Menge dichter?','Where is the crowd denser?'),q:tr('Auf welcher Seite stehen mehr Menschen auf derselben Fläche?','Which side has more people in the same space?'),kind:'choose',choices:[{pic:'crowdFew'},{pic:'crowdMany'},{pic:'crowdMedium'}],correct:1,hint:tr('Zähle die Punkte in gleich großen Kästchen.','Count the dots in the equally sized boxes.'),why:tr('So veranschaulicht unser Nanomaterial-Poster eine Verteilung: In Bereichen hoher Elektronendichte befinden sich mehr Elektronen pro Raumvolumen.','Our nanomaterials poster uses crowds to illustrate distributions: higher electron density means more electron density in a given region.')},
{id:'pore',topic:'nanopore',title:tr('Das Molekül im Nanoporen-Sensor','A molecule in the nanopore'),q:tr('Welche Zeichnung zeigt ein Molekül, das durch eine Öffnung in der Membran wandert?','Which drawing shows a molecule passing through a gap in a membrane?'),kind:'choose',choices:[{pic:'blocked'},{pic:'porePass'},{pic:'solid'}],correct:1,hint:tr('Die Membran braucht ein Loch in der Mitte.','The membrane needs a hole in the middle.'),why:tr('Eine Nanopore ist ein winziger Kanal. Moleküle können hindurchtransportiert und über Änderungen des Ionenstroms untersucht werden.','A nanopore is a tiny channel. Molecules can pass through it and be studied through changes in ionic current.')},
{id:'signal',topic:'nanopore',title:tr('Die Spur im Strom','A trace in the current'),q:tr('Welcher Stromverlauf zeigt einen kurzen Abfall, wenn etwas durch die Pore geht?','Which current trace shows a brief drop when something passes through the pore?'),kind:'choose',choices:[{pic:'flat'},{pic:'dip'},{pic:'rise'}],correct:1,hint:tr('Suche eine Linie, die kurz nach unten geht und wieder zurückkommt.','Look for a line that briefly falls and returns.'),why:tr('Das Poster zeigt Blockaden als Abfälle des Ionenstroms gegenüber dem offenen Porenstrom.','The poster shows blockade events as drops in ionic current relative to the open-pore current.')},
{id:'music',topic:'ml',title:tr('Trainiere den Musik-Roboter','Teach the music robot'),q:tr('Grün bedeutet „gefällt“, Rot „gefällt nicht“. Was würdest du für den gelben Song vorhersagen?','Green means “like” and red means “dislike”. What would you predict for the yellow song?'),kind:'music',choices:[{icon:'💚',label:tr('Gefällt','Like')},{icon:'❤️‍🩹',label:tr('Gefällt nicht','Dislike')}],correct:0,hint:tr('Vergleiche den gelben Punkt mit seinen nächsten Nachbarn.','Compare the yellow point with its nearest neighbors.'),why:tr('Das Poster verwendet genau diese Idee: k-Nearest Neighbors vergleicht neue Beispiele mit ähnlichen bekannten Beispielen.','The poster uses this very idea: k-nearest neighbors compares new cases with similar labeled examples.')},
{id:'alphafold',topic:'fold',title:tr('Vom Faden zur 3D-Form','From a chain to a 3D shape'),q:tr('Was möchte AlphaFold aus einer Proteinsequenz vorhersagen?','What does AlphaFold try to predict from a protein sequence?'),kind:'choose',choices:[{pic:'fold'},{pic:'thermometer'},{pic:'lightning'}],correct:0,hint:tr('Stell dir eine lange Kette vor, die sich räumlich faltet.','Imagine a long chain folding in space.'),why:tr('AlphaFold sagt aus Proteinsequenzinformationen eine räumliche Proteinstruktur vorher; die Vorhersage muss je nach Anwendung bewertet werden.','AlphaFold predicts a 3D protein structure from sequence information; predictions still need to be assessed for their intended use.')},
{id:'super',topic:'pinn',title:tr('Der besonders kalte Stoff','A very cold material'),q:tr('Welches Symbol passt zu den tiefen Temperaturen, bei denen viele Materialien supraleitend werden?','Which symbol matches the low temperatures at which many materials become superconducting?'),kind:'choose',choices:[{icon:'🔥'},{icon:'❄️'},{icon:'☀️'}],correct:1,hint:tr('Denke an Kälte, nicht Hitze.','Think cold, not hot.'),why:tr('Im Poster ist die kritische Temperatur Tc die Temperaturgrenze des supraleitenden Zustands; sie ist materialabhängig.','The poster uses critical temperature Tc as the boundary for the superconducting state; its value depends on the material.')}
],lab:[
{id:'md',topic:'md',title:tr('Atome in Bewegung: Molecular Dynamics','Atoms in motion: molecular dynamics'),q:tr('Welches physikalische Gesetz ist die Grundlage der Bewegungsrechnung im MD-Poster?','Which physical law underpins the motion calculations in the MD poster?'),kind:'choose',choices:[{label:tr('F = m · a','F = m · a')},{label:tr('I = U / R','I = U / R')},{label:tr('E = h · f','E = h · f')}],correct:0,hint:tr('Im Poster sieht man Kraft, Masse und Beschleunigung an Autos.','The poster illustrates force, mass, and acceleration using cars.'),why:tr('MD integriert Bewegungsgleichungen mit modellierten Kräften (Kraftfeld), um zeitliche Atompositionen zu erhalten.','MD integrates equations of motion using modeled forces (a force field) to obtain atom trajectories.')},
{id:'dft',topic:'density',title:tr('Elektronendichte statt Elektronenbahnen','Electron density instead of little orbits'),q:tr('Was beschreibt die Elektronendichte im DFT-Poster?','What does electron density describe in the DFT poster?'),kind:'choose',choices:[{label:tr('Die räumliche Verteilung der Elektronen','The spatial distribution of electrons')},{label:tr('Nur die Masse eines einzelnen Protons','Only a single proton’s mass')},{label:tr('Die Temperatur einer Proteinlösung','A protein solution’s temperature')}],correct:0,hint:tr('Denke an die Menschenmenge als Vergleich im Poster.','Think about the crowd analogy in the poster.'),why:tr('DFT nutzt die Elektronendichte als zentrale Größe, um Materialeigenschaften zu untersuchen.','DFT uses electron density as a central quantity to investigate material properties.')},
{id:'current',topic:'nanopore',title:tr('Lesen eines Nanoporen-Signals','Read a nanopore signal'),q:tr('Eine schematische Pore hat offen 100 pA und beim Durchgang 70 pA. Wie groß ist die relative Stromblockade?','A schematic pore carries 100 pA when open and 70 pA during passage. What is the relative current blockade?'),kind:'choose',choices:[{label:'30 %'},{label:'70 %'},{label:'170 %'}],correct:0,hint:tr('Vergleiche die Stromdifferenz mit dem offenen Strom: (100−70)/100.','Compare the current difference with the open current: (100−70)/100.'),why:tr('ΔI/I₀ = (100−70)/100 = 30 %. Eine Signalblockade allein beweist noch nicht die Identität des Moleküls.','ΔI/I₀ = (100−70)/100 = 30%. A blockade alone does not establish molecular identity.')},
{id:'knn',topic:'ml',title:tr('k-Nearest Neighbors auf dem Musik-Poster','k-Nearest Neighbors on the music poster'),q:tr('Wo ordnet der Algorithmus den gelben Song ein, wenn seine nächsten Nachbarn überwiegend grün sind?','How does the algorithm classify the yellow song if most nearest neighbors are green?'),kind:'music',choices:[{icon:'💚',label:tr('Gefällt','Like')},{icon:'💔',label:tr('Gefällt nicht','Dislike')}],correct:0,hint:tr('KNN stimmt anhand der Labels der nächsten Datenpunkte ab.','KNN votes using the labels of nearby data points.'),why:tr('Das Poster erklärt ein überwachtes Lernverfahren anhand von Tempo und Intensität eines Songs. Die Zuordnung hängt von k und der Distanzdefinition ab.','The poster illustrates supervised learning using song tempo and intensity. Classification depends on k and the distance measure.')},
{id:'folding',topic:'fold',title:tr('Warum AlphaFold?','Why AlphaFold?'),q:tr('Welche Eingabe dient AlphaFold als Ausgangspunkt einer Strukturvorhersage?','What is the starting input for AlphaFold structure prediction?'),kind:'choose',choices:[{label:tr('Eine Aminosäuresequenz und verwandte Sequenzinformationen','An amino-acid sequence and related sequence information')},{label:tr('Nur die Farbe des Proteins','Only the protein’s color')},{label:tr('Nur eine gemessene Körpertemperatur','Only a measured body temperature')}],correct:0,hint:tr('Der Ablauf im Poster startet mit einer Proteinsequenz.','The workflow in the poster starts with a protein sequence.'),why:tr('Das Poster zeigt den Weg von Proteinsequenzen über gelernte Muster zur vorhergesagten 3D-Struktur.','The poster shows protein sequences passing through learned representations to a predicted 3D structure.')},
{id:'pinn',topic:'pinn',title:tr('PINN: Daten + Physik','PINN: data + physics'),q:tr('Welche beiden Informationen tragen im Poster zur Trainings-Zielfunktion eines PINNs bei?','Which two sources of information contribute to a PINN training objective in the poster?'),kind:'choose',choices:[{label:tr('Datenfehler und Physikfehler','Data loss and physics loss')},{label:tr('Nur die Farbe des Diagramms','Only the chart color')},{label:tr('Nur zufällige Zahlen','Only random numbers')}],correct:0,hint:tr('Schau auf die zwei Kästen, die in „Total Loss“ führen.','Look at the two boxes feeding into “Total Loss”.'),why:tr('Ein PINN verbindet Übereinstimmung mit Daten mit Nebenbedingungen aus bekannten physikalischen Beziehungen. Die konkrete Wirksamkeit muss getestet werden.','A PINN combines agreement with observations and constraints from physical relationships. Its effectiveness must be evaluated.')},
{id:'tc',topic:'pinn',title:tr('Was ist Tc?','What is Tc?'),q:tr('Welche Zielgröße versucht das Supraleiter-Beispiel im PINN-Poster vorherzusagen?','What target quantity does the superconductivity example in the PINN poster try to predict?'),kind:'choose',choices:[{label:tr('Die kritische Temperatur Tc','The critical temperature Tc')},{label:tr('Die Farbe des Materials','The color of the material')},{label:tr('Die Länge eines DNA-Strangs','The length of a DNA strand')}],correct:0,hint:tr('Das Poster bezeichnet die Zielgröße mit einem T und kleinem c.','The poster denotes the target using T with a small c.'),why:tr('Die Fallstudie beschreibt die Vorhersage von Tc aus Materialmerkmalen unter Einbezug physikalischer Beziehungen.','The case study describes predicting Tc from material descriptors while incorporating physical relationships.')},
{id:'controls',topic:'ml',title:tr('Ist das Modell wirklich besser?','Is the model actually better?'),q:tr('Wie bewertet man fair, ob das PINN im Poster bessere Vorhersagen liefert als klassisches ML?','How can we fairly evaluate whether the PINN in the poster predicts better than standard ML?'),kind:'choose',choices:[{label:tr('Beide auf denselben ungesehenen Testdaten vergleichen','Compare both on the same unseen test data')},{label:tr('Nur die schönere Grafik wählen','Choose whichever plot looks nicer')},{label:tr('Nur die Trainingsbeispiele zählen','Only count training examples')}],correct:0,hint:tr('Das Poster enthält einen Schritt zur Modell-Evaluation.','The poster includes a model-evaluation step.'),why:tr('Die Poster nennen mögliche Vorteile von PINNs. Ob diese in einem konkreten Datensatz auftreten, muss ein kontrollierter Modellvergleich zeigen.','The posters discuss potential benefits of PINNs. Whether they hold in a given dataset requires a controlled comparison.')}
]};
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function media(type){let a='';if(type==='dna')a='<path d="M18 8 Q62 74 106 8 M18 82 Q62 16 106 82" stroke="#79efd2" stroke-width="7" fill="none"/><path d="M28 19 L96 71 M38 33 L87 59 M48 44 L78 47 M58 57 L67 33 M68 70 L58 22" stroke="#ffc66b" stroke-width="4"/>';if(type==='sphere')a='<circle cx="62" cy="45" r="30" fill="#ffd888"/><circle cx="49" cy="30" r="8" fill="#e7a0ff"/>';if(type==='water')a='<path d="M62 10 Q31 49 32 62 A30 30 0 0 0 92 62 Q93 49 62 10" fill="#79d8fc"/>';if(type==='dots')a=[26,62,98].map(x=>`<circle cx="${x}" cy="45" r="13" fill="#b9a1ff"/>`).join('');if(type==='chain')a='<path d="M23 45 L47 28 L72 52 L101 36" fill="none" stroke="#fdd284" stroke-width="6"/>'+[[23,45],[47,28],[72,52],[101,36]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="12" fill="${i%2?'#78e9cf':'#b1a0fc'}"/>`).join('');if(type==='cube')a='<rect x="35" y="18" width="54" height="54" rx="3" fill="#a1c3e9"/>';if(type.startsWith('crowd')){let n=type==='crowdFew'?4:type==='crowdMedium'?8:15;for(let i=0;i<n;i++)a+=`<circle cx="${17+(i%5)*22}" cy="${18+Math.floor(i/5)*25}" r="7" fill="#8fe6f5"/>`}if(type==='blocked'||type==='porePass'||type==='solid'){a='<rect x="15" y="22" width="43" height="45" rx="3" fill="#8f92e8"/><rect x="68" y="22" width="43" height="45" rx="3" fill="#8f92e8"/>';if(type==='solid')a='<rect x="15" y="22" width="96" height="45" fill="#8f92e8"/>';else a+=`<circle cx="${type==='porePass'?63:35}" cy="45" r="10" fill="#ffd888"/>`}if(['flat','dip','rise'].includes(type)){let pts=type==='flat'?'8,24 116,24':type==='dip'?'8,24 35,24 35,65 81,65 81,24 116,24':'8,65 35,65 35,24 81,24 81,65 116,65';a=`<polyline points="${pts}" stroke="#79efd2" stroke-width="6" fill="none"/>`}if(type==='fold')a='<path d="M20 23 C100 -5 26 92 99 54 S41 16 65 76" stroke="#8df0d9" stroke-width="11" fill="none"/>';if(type==='thermometer')a='<rect x="55" y="15" width="15" height="52" rx="8" fill="#8cb5fd"/><circle cx="62" cy="69" r="13" fill="#fc9a86"/>';if(type==='lightning')a='<path d="M73 8 L37 48 H65 L49 83 L92 34 H66 Z" fill="#ffe18d"/>';return `<svg viewBox="0 0 124 90" role="img" aria-label="${type}" style="width:100%;max-width:145px"><rect width="124" height="90" rx="12" fill="#0b2740"/>${a}</svg>`}
function plot(){return `<svg class="graph" viewBox="0 0 460 250" role="img" aria-label="Music tempo versus intensity chart"><rect width="460" height="250" rx="15" fill="#0b2740"/><path d="M58 20 V210 H435" stroke="#cbe5f4" stroke-width="3" fill="none"/><text x="248" y="240" fill="#d4e4f0" font-size="14">${lang==='de'?'Tempo':'Tempo'} →</text><text x="15" y="135" fill="#d4e4f0" font-size="13" transform="rotate(-90 15 135)">${lang==='de'?'Intensität':'Intensity'} →</text>${[[290,68],[325,82],[347,53],[307,105],[365,95],[385,60]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="10" fill="#83edb3"/>`).join('')}${[[120,155],[150,170],[160,135],[183,177]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="10" fill="#ff919a"/>`).join('')}<circle cx="335" cy="115" r="34" stroke="#ffdf8a" stroke-width="2" stroke-dasharray="5 5" fill="none"/><circle cx="335" cy="115" r="11" fill="#ffdc80"/></svg>`}
function shell(content){document.documentElement.lang=lang;const s=U[lang];app.innerHTML=`<header><div class="brand">⚛ Nano<span>Quest</span></div><div class="langbar"><button data-lang="de" class="${lang==='de'?'on':''}" aria-pressed="${lang==='de'}">DE</button><button data-lang="en" class="${lang==='en'?'on':''}" aria-pressed="${lang==='en'}">EN</button></div></header>${content}<div class="foot">${s.foot}</div>`}
function home(){track=null;const s=U[lang];shell(`<section class="panel"><div class="eyebrow">SCIENCE NIGHT · DE / EN</div><h1>${s.hero}</h1><p class="lead">${s.intro}</p><div class="chips"><span class="chip">16 ${lang==='de'?'Missionen':'missions'}</span><span class="chip">2 ${lang==='de'?'Altersgruppen':'age groups'}</span><span class="chip">iPad · Safari</span></div><h2 style="margin-top:30px">${s.pick}</h2><div class="tracks"><button class="track" data-track="kids"><span class="emoji">🧬🎨</span><strong>${s.a}</strong><span>${s.ad}</span><span class="chip">8 ${lang==='de'?'Missionen':'missions'}</span></button><button class="track" data-track="lab"><span class="emoji">🔬📊</span><strong>${s.b}</strong><span>${s.bd}</span><span class="chip">8 ${lang==='de'?'Missionen':'missions'}</span></button></div></section>`)}
function selectMarkup(o,i){return `<button class="opt" data-option="${i}" aria-pressed="false">${o.pic?media(o.pic):o.icon?`<span class="em">${o.icon}</span>`:''}${o.label?`<span class="lab">${esc(tx(o.label))}</span>`:''}</button>`}
function render(){if(!track)return home();const s=U[lang],arr=tasks[track];if(idx>=arr.length)return finish();let m=arr[idx];answer=-1;done=false;tries=0;slider=20;let scene=m.kind==='music'?`<div class="two"><div>${plot()}<div class="legend"><span><i class="dot" style="background:#83edb3"></i>${s.liked}</span><span><i class="dot" style="background:#ff919a"></i>${s.notLiked}</span><span><i class="dot" style="background:#ffdc80"></i>${s.new}</span></div></div><div class="callout">${s.observe}<p class="muted">${s.snapshot}</p></div></div>`:`<div class="sequence"><span class="step">${m.topic==='molecules'?'🧬 DNA · Proteine':m.topic==='nanopore'?'🕳️ Nanopore':m.topic==='ml'?'🤖 Machine Learning':m.topic==='pinn'?'❄️ PINN · Tc':m.topic==='fold'?'🧩 AlphaFold':m.topic==='md'?'⚛️ MD':'🌐 DFT'}</span></div>`;shell(`<div class="headrow"><button class="btn secondary" data-action="home">${s.back}</button><span class="chip">${track==='kids'?s.a:s.b} · ${s.task} ${idx+1}/8</span><span class="chip">⭐ ${score} ${s.points}</span><div class="bar"><div style="width:${idx*12.5}%"></div></div></div><section class="panel"><div class="eyebrow">${s.task} ${idx+1} / 8</div><h2>${tx(m.title)}</h2><p class="lead">${tx(m.q)}</p><div class="scene">${scene}<div class="choices">${m.choices.map(selectMarkup).join('')}</div></div><div class="controls"><button class="btn" data-action="check">${s.check}</button><button class="btn secondary" data-action="hint">${s.hint}</button></div><div id="message" class="message" role="status" aria-live="polite">${s.choose}</div></section>`)}
function note(msg,type=''){const el=app.querySelector('#message');if(el){el.className='message '+type;el.textContent=msg}}
function check(){if(done)return;const s=U[lang],m=tasks[track][idx];if(answer<0){note(s.choose,'no');return}tries++;if(answer!==m.correct){note(s.try,'no');return}done=true;if(!awarded.has(track+':'+idx)){score+=tries===1?100:70;awarded.add(track+':'+idx)}note('✅ '+s.correct+' '+s.explain+' '+tx(m.why),'yes');app.querySelector('.controls').innerHTML=`<button class="btn" data-action="next">${idx===7?s.results:s.next}</button>`;app.querySelectorAll('[data-option]').forEach(b=>b.disabled=true)}
function finish(){const s=U[lang];shell(`<section class="panel" style="text-align:center"><div style="font-size:70px">🏆✨</div><div class="eyebrow">${s.finish}</div><h1>${s.hero}</h1><div class="num">${score} / 800 ${s.points}</div><p class="lead" style="margin:22px auto">${s.intro}</p><div class="controls" style="justify-content:center"><button class="btn" data-action="again">↻ ${s.restart}</button><button class="btn secondary" data-action="home">${s.other}</button></div></section>`)}
app.addEventListener('click',e=>{const b=e.target.closest('[data-lang],[data-track],[data-action],[data-option]');if(!b)return;if(b.dataset.lang){lang=b.dataset.lang;if(!track)home();else if(idx>=8)finish();else render();return}if(b.dataset.track){track=b.dataset.track;idx=0;score=0;awarded.clear();render();return}if(b.dataset.option!==undefined){if(done)return;answer=Number(b.dataset.option);app.querySelectorAll('[data-option]').forEach(x=>{const v=Number(x.dataset.option)===answer;x.classList.toggle('selected',v);x.setAttribute('aria-pressed',String(v))});return}switch(b.dataset.action){case'home':home();break;case'hint':note(tx(tasks[track][idx].hint));break;case'check':check();break;case'next':idx++;render();break;case'again':idx=0;score=0;awarded.clear();render();break}});home();})();
</script></body></html>
