<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09172b">
<title>NanoQuest 5.0</title>
<style>
:root{color-scheme:dark;--bg:#09172b;--bg2:#133454;--panel:#112743;--panel2:#183959;--line:#40657f;--ink:#f4fbff;--muted:#c4d8e8;--green:#73f0d2;--gold:#ffd887;--bad:#ffb18f}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 20% -10%,#24527e,#09172b 62%);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#app{max-width:1100px;margin:auto;padding:clamp(12px,3vw,28px)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}.logo{font-size:clamp(24px,4vw,34px);font-weight:950;letter-spacing:-1px}.logo em{font-style:normal;color:var(--green)}
.langs{display:flex;gap:6px;background:#102740;border:1px solid var(--line);padding:5px;border-radius:15px}.lang{border:0;background:transparent;color:#eefaff;padding:9px 14px;border-radius:10px;font-weight:850}.lang.on{background:var(--green);color:#082037}
.panel{background:linear-gradient(140deg,#153553,#10263f);border:1px solid var(--line);border-radius:24px;padding:clamp(16px,3vw,30px);box-shadow:0 20px 60px #0004}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--green);font-weight:900}h1{font-size:clamp(30px,6vw,54px);margin:10px 0 14px;line-height:1.1;letter-spacing:-.04em}h2{font-size:clamp(24px,4vw,34px);line-height:1.18;margin:10px 0 8px}p{color:#e3f0f8}.lead{font-size:clamp(16px,2.3vw,19px);max-width:800px}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}.age{border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:20px;min-height:190px;text-align:left;color:white;display:flex;flex-direction:column;gap:8px}.age:hover,.age:focus-visible,.choice.selected{border-color:var(--green);background:#205166}.age .icon{font-size:42px}.age strong{font-size:22px}.chip{display:inline-block;padding:6px 10px;border-radius:999px;background:#244c68;color:#ecfaff;font-size:12px;font-weight:850}.btn{border:1px solid transparent;background:var(--green);color:#08263a;padding:12px 18px;min-height:48px;border-radius:14px;font-weight:850}.btn.alt{background:#244c68;border-color:#517895;color:white}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.stage{background:#091f35;border:1px solid var(--line);border-radius:18px;padding:clamp(12px,3vw,22px);margin-top:18px}.hero{width:100%;height:auto;display:block;max-height:220px;border-radius:14px;background:#0b2138}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.choice{min-height:120px;border:2px solid #4b728d;border-radius:17px;background:#173655;color:white;padding:12px 8px;font-weight:850;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}.choice .big{font-size:42px;line-height:1}.choice .small{font-size:14px;line-height:1.3;color:#f2f8ff}.choice svg{width:96px;height:54px}
.feedback{margin-top:16px;padding:14px;border-radius:14px;border:1px solid #4a6c86;background:#183751;min-height:56px}.feedback.good{border-color:var(--green);background:#13403f}.feedback.bad{border-color:var(--bad)}
.progress{height:10px;background:#2a4862;border-radius:999px;overflow:hidden;width:min(220px,40vw)}.progress>div{height:100%;background:var(--green)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.stats>div{background:#143554;border:1px solid #416280;border-radius:12px;padding:12px}.stat{font-size:25px;font-weight:900;color:var(--green)}
.slider{width:100%;accent-color:var(--green);height:44px;margin-top:8px}.meter{display:flex;justify-content:space-between;gap:10px;font-weight:850}
footer{text-align:center;color:#abc8da;font-size:12px;padding:18px 8px}.celebrate{text-align:center;font-size:78px}
@media (max-width:780px){.row{grid-template-columns:1fr}.age{min-height:100px;display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center}.age .icon{grid-row:span 3}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.choice{min-height:110px}.choice.wide{grid-column:1/-1}}
@media (max-width:520px){.choices{grid-template-columns:1fr 1fr}.choice .big{font-size:35px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
'use strict';
const app=document.getElementById('app');
let lang='de',group=null,index=0,selected=-1,score=0,tries=0,done=false,sliderValue=0;
const UI={de:{tag:'Wissenschaft zum Mitspielen',headline:'Entdecke Moleküle mit Bildern, Signalen und Experimenten.',lead:'Wähle eine Altersstufe und löse passende Mini-Spiele über DNA, Proteine, Nanoporen und Messsignale. Für Kinder sind die Aufgaben bildhafter, für Jugendliche und Erwachsene etwas wissenschaftlicher.',choose:'Wähle deine Altersgruppe',ages:['Entdecker','Experimentierer','Forschungslabor'],descs:['Leichte Bild- und Symbolspiele','Etwas mehr Rechnen und Experimentieren','Richtige Forschungslogik – aber verständlich'],missions:'Missionen',groupsLabel:'Altersgruppen',back:'← Zur Alterswahl',challenge:'Aufgabe',check:'Antwort prüfen',hint:'Tipp',next:'Nächste Mission →',finish:'Ergebnis ansehen →',result:'Mission geschafft!',again:'Nochmal spielen',other:'Andere Altersgruppe',startText:'Schaue dir die Aufgabe an und wähle eine Antwort.',chooseFirst:'Wähle zuerst eine Antwort.',retry:'Noch nicht ganz. Schau noch einmal genau hin.',correct:'Richtig!',points:'Punkte',goal:'Ziel',well:'Super gemacht!',ready:'Bereit für neue Entdeckungen!',footer:'Vereinfachte Lernmodelle. Kein Login, keine Werbung, keine Datenerhebung.',language:'Sprache',mission:'Mission'},en:{tag:'Hands-on science',headline:'Discover molecules with pictures, signals, and experiments.',lead:'Choose an age group and solve matching mini-games about DNA, proteins, nanopores, and measurement signals. The children’s level is more visual, while the teen and adult levels are more scientific.',choose:'Choose your age group',ages:['Explorers','Experimenters','Research Lab'],descs:['Easy picture and symbol games','More experimenting and a little math','Real research logic – but still accessible'],missions:'missions',groupsLabel:'age groups',back:'← Age selection',challenge:'Challenge',check:'Check answer',hint:'Hint',next:'Next mission →',finish:'See results →',result:'Mission complete!',again:'Play again',other:'Other age group',startText:'Look at the task and choose an answer.',chooseFirst:'Choose an answer first.',retry:'Not quite. Look carefully and try again.',correct:'Correct!',points:'points',goal:'Goal',well:'Great job!',ready:'Ready for new discoveries!',footer:'Simplified teaching models. No login, no ads, no data collection.',language:'Language',mission:'Mission'}};
const groups=[{id:'kids',age:'8–11',emoji:'🧩'},{id:'teens',age:'12–15',emoji:'⚡'},{id:'adults',age:'16+',emoji:'🔬'}];
const T=(de,en)=>({de,en});
const tx=v=>typeof v==='string'?v:(v&&v[lang]?v[lang]:'');
const tasks={
kids:[
{title:T('Was ist DNA?','What is DNA?'),q:T('Welches Bild zeigt DNA?','Which picture shows DNA?'),art:'dna',options:[{icon:'💧',label:T('','')},{icon:'🧬',label:T('','')},{icon:'⚽',label:T('','')}],answer:1,hint:T('Suche die Form, die wie eine verdrehte Leiter aussieht.','Look for the shape that looks like a twisted ladder.'),why:T('DNA wird oft als Doppelhelix dargestellt – wie eine gedrehte Leiter.','DNA is often shown as a double helix – like a twisted ladder.')},
{title:T('Protein finden','Find the protein'),q:T('Welches Symbol passt am besten zu einem gefalteten Protein?','Which symbol best matches a folded protein?'),art:'protein',options:[{icon:'🌀',label:T('gefaltet','folded')},{icon:'🧱',label:T('Block','block')},{icon:'🌊',label:T('Welle','wave')}],answer:0,hint:T('Proteine sind lange Ketten, die sich oft zusammenfalten.','Proteins are long chains that often fold up.'),why:T('Viele Proteine falten sich zu kompakten Formen zusammen.','Many proteins fold into compact shapes.')},
{title:T('Die passende Pore','Pick the right pore'),q:T('Ein Molekül ist 6 nm groß. Welche Öffnung ist groß genug?','A molecule is 6 nm wide. Which opening is large enough?'),art:'pore',options:[{icon:'🔵',label:T('3 nm','3 nm')},{icon:'🟡',label:T('6 nm','6 nm')},{icon:'🟢',label:T('8 nm','8 nm')}],answer:2,hint:T('Die Öffnung muss größer sein als das Molekül.','The opening must be larger than the molecule.'),why:T('8 nm ist größer als 6 nm und damit groß genug.','8 nm is larger than 6 nm, so it is big enough.')},
{title:T('Signal sehen','Spot the signal'),q:T('In welchem Bild ist EIN kurzer Abfall des Stroms zu sehen?','Which picture shows ONE short drop in current?'),art:'wave',options:[{svg:'flat'},{svg:'onedip'},{svg:'twodip'}],answer:1,hint:T('Suche eine Kurve, die nur einmal kurz nach unten geht.','Look for a curve that goes down only once.'),why:T('Ein vorbeiziehendes Molekül kann einen kurzen Stromabfall verursachen.','A passing molecule can cause a short current drop.')},
{title:T('Faire Vergleichsprobe','Fair test'),q:T('Welcher Vergleich ist fairer?','Which comparison is fairer?'),art:'lab',options:[{icon:'⚖️',label:T('Gleiche Pore, gleiche Flüssigkeit, nur Molekül anders','Same pore, same liquid, only the molecule changes')},{icon:'🎲',label:T('Alles gleichzeitig ändern','Change everything at once')},{icon:'❓',label:T('Gar nichts vergleichen','Compare nothing')}],answer:0,hint:T('Bei einem fairen Test ändert man möglichst nur eine Sache.','In a fair test, you try to change only one thing.'),why:T('Wenn fast alles gleich bleibt, sieht man besser, was wirklich den Unterschied macht.','If almost everything stays the same, you can better see what really causes the difference.')},
{title:T('Computer-Helfer','Computer helper'),q:T('Welches Muster passt am besten zum geheimen Signal?','Which pattern best matches the secret signal?'),art:'match',options:[{svg:'matchA'},{svg:'matchB'},{svg:'matchC'}],answer:2,hint:T('Achte auf die Reihenfolge der kurzen und langen Abfälle.','Watch the order of the short and long drops.'),why:T('Computer vergleichen Signalmuster, um Ähnlichkeiten zu finden.','Computers compare signal patterns to find similarities.')}
],
teens:[
{title:T('DNA oder Protein?','DNA or protein?'),q:T('Welche Aussage passt meistens?','Which statement is usually correct?'),art:'dna',options:[{icon:'🧬',label:T('DNA trägt oft Erbinformation','DNA often carries genetic information')},{icon:'🍬',label:T('Zucker ist ein Protein','Sugar is a protein')},{icon:'💧',label:T('Wasser ist ein Gen','Water is a gene')}],answer:0,hint:T('Denke an die „Bauanleitung“ in Zellen.','Think about the “instruction manual” in cells.'),why:T('DNA speichert in vielen Organismen die genetische Information.','DNA stores genetic information in many organisms.')},
{title:T('Porengröße wählen','Choose a pore size'),q:T('Ein Teilchen ist 4 nm breit. Welche Pore ist sinnvoll, wenn es hindurchpassen, aber nicht zu viel Platz haben soll?','A particle is 4 nm wide. Which pore is sensible if it should pass through, but without too much extra space?'),art:'pore',options:[{icon:'🔵',label:'3 nm'},{icon:'🟢',label:'5 nm'},{icon:'🟣',label:'12 nm'}],answer:1,hint:T('Zu klein geht nicht; viel zu groß ist oft nicht ideal zum Messen.','Too small will not work; much too large is often not ideal for sensing.'),why:T('5 nm ist knapp größer als 4 nm und damit oft sinnvoller als eine sehr große Pore.','5 nm is just larger than 4 nm and is often more useful than a much bigger pore.')},
{title:T('Spannung einstellen','Adjust the voltage'),q:T('Stelle die Spannung so ein, dass die Modellgeschwindigkeit ungefähr im grünen Zielbereich 3–4 liegt.','Set the voltage so that the model speed is roughly in the green target range 3–4.'),art:'pore',type:'slider',min:20,max:120,step:5,init:20,unit:'mV',low:60,high:80,formula:v=>(v/20).toFixed(1),hint:T('Mehr Spannung erhöht in diesem Lernmodell die Geschwindigkeit.','In this learning model, more voltage increases the speed.'),why:T('Ein passender Bereich kann helfen, dass ein Molekül nicht zu langsam, aber auch nicht zu schnell unterwegs ist.','A suitable range can help keep a molecule from moving too slowly or too quickly.')},
{title:T('Blockade berechnen','Calculate the blockade'),q:T('Der offene Strom ist 100 pA, während eines Ereignisses 75 pA. Wie groß ist die prozentuale Blockade?','The open current is 100 pA and during an event it is 75 pA. What is the blockade percentage?'),art:'wave',options:[{icon:'①',label:'25 %'},{icon:'②',label:'50 %'},{icon:'③',label:'75 %'}],answer:0,hint:T('Rechne (100−75)/100.','Compute (100−75)/100.'),why:T('(100−75)/100 = 25 %.','(100−75)/100 = 25%.')},
{title:T('Welches Signal ist besser?','Which signal is better?'),q:T('Welches Signal lässt sich leichter auswerten?','Which signal is easier to analyze?'),art:'wave',options:[{svg:'noisy'},{svg:'clean'},{svg:'flat'}],answer:1,hint:T('Weniger Rauschen macht Muster leichter erkennbar.','Less noise makes patterns easier to see.'),why:T('Ein klares Signal mit wenig Rauschen ist oft einfacher zu analysieren.','A clear signal with little noise is often easier to analyze.')},
{title:T('Warum wiederholen?','Why repeat experiments?'),q:T('Warum sind Wiederholungen wichtig?','Why are repeat experiments important?'),art:'lab',options:[{icon:'🔁',label:T('Um zu prüfen, ob das Ergebnis zuverlässig ist','To check whether the result is reliable')},{icon:'🎨',label:T('Nur damit es schöner aussieht','Only to make it look nicer')},{icon:'🚫',label:T('Wiederholungen braucht man nie','You never need repeats')}],answer:0,hint:T('Ein einzelnes Ergebnis kann Zufall sein.','A single result can be due to chance.'),why:T('Wiederholungen helfen einzuschätzen, ob ein Ergebnis stabil und vertrauenswürdig ist.','Repeats help judge whether a result is stable and trustworthy.')}
],
adults:[
{title:T('Strom aus Leitwert und Spannung','Current from conductance and voltage'),q:T('Wenn der Leitwert 2 nS und die Spannung 100 mV beträgt, wie groß ist der Strom? (I = G × V)','If the conductance is 2 nS and the voltage is 100 mV, what is the current? (I = G × V)'),art:'lab',options:[{icon:'①',label:'20 pA'},{icon:'②',label:'200 pA'},{icon:'③',label:'2000 pA'}],answer:1,hint:T('2 × 100 = 200, und nS × mV ergibt pA.','2 × 100 = 200, and nS × mV gives pA.'),why:T('2 nS × 100 mV = 200 pA.','2 nS × 100 mV = 200 pA.')},
{title:T('Amplituden-Blockade','Amplitude blockade'),q:T('Der offene Strom beträgt 180 pA, während eines Ereignisses 120 pA. Wie groß ist die absolute Blockade-Amplitude?','The open current is 180 pA, and during an event it is 120 pA. What is the absolute blockade amplitude?'),art:'wave',options:[{icon:'①',label:'30 pA'},{icon:'②',label:'60 pA'},{icon:'③',label:'120 pA'}],answer:1,hint:T('Ziehe den Ereignisstrom vom offenen Strom ab.','Subtract event current from open current.'),why:T('180 − 120 = 60 pA.','180 − 120 = 60 pA.')},
{title:T('Kontroll-Experiment','Control experiment'),q:T('Welche Kontrolle ist am sinnvollsten, wenn du testen willst, ob ein Signal wirklich vom Molekül stammt?','Which control is most useful if you want to test whether a signal truly comes from the molecule?'),art:'lab',options:[{icon:'🧪',label:T('Die gleiche Messung ohne Molekül durchführen','Run the same measurement without the molecule')},{icon:'🎲',label:T('Pore, Salz und Spannung gleichzeitig ändern','Change pore, salt, and voltage all at once')},{icon:'⏭️',label:T('Auf Kontrollen ganz verzichten','Skip controls entirely')}],answer:0,hint:T('Eine gute Kontrolle entfernt gezielt nur den vermuteten Auslöser.','A good control removes only the suspected cause.'),why:T('Ohne Molekül kann man prüfen, welche Signale auch ohne Analyten auftreten.','Without the molecule, you can see which signals occur even without the analyte.')},
{title:T('Klassifikation','Classification'),q:T('Klasse A hat typischerweise 20 % Blockade, Klasse B 45 %. Du misst 40 %. Welche Klasse ist näher?','Class A typically has 20% blockade and class B 45%. You measure 40%. Which class is closer?'),art:'match',options:[{icon:'🅰️',label:T('Klasse A','Class A')},{icon:'🅱️',label:T('Klasse B','Class B')},{icon:'❔',label:T('Beide gleich','Both equally')}],answer:1,hint:T('Vergleiche die Abstände zu 20 und zu 45.','Compare the distances to 20 and to 45.'),why:T('40 liegt nur 5 Prozentpunkte von 45 entfernt, aber 20 Prozentpunkte von 20.','40 is only 5 percentage points away from 45, but 20 percentage points away from 20.')},
{title:T('Signal oder Rauschen?','Signal or noise?'),q:T('Welcher Verlauf zeigt am ehesten ein wiedererkennbares Ereignis statt nur starkes Rauschen?','Which trace most likely shows a recognizable event rather than just heavy noise?'),art:'wave',options:[{svg:'noisy'},{svg:'cleanEvent'},{svg:'flat'}],answer:1,hint:T('Suche eine klare Abweichung vom Grundsignal.','Look for a clear deviation from the baseline.'),why:T('Ein klarer, lokaler Abfall ist oft leichter als Ereignis zu deuten als reines Rauschen.','A clear local drop is often easier to interpret as an event than pure noise.')},
{title:T('Warum mehrere Merkmale?','Why use multiple features?'),q:T('Warum sollte man ein Molekül nicht nur über eine einzige Stromamplitude identifizieren?','Why should a molecule not be identified from just a single current amplitude?'),art:'protein',options:[{icon:'📊',label:T('Weil verschiedene Moleküle ähnliche Amplituden haben können','Because different molecules can have similar amplitudes')},{icon:'🚫',label:T('Weil Strom nie messbar ist','Because current can never be measured')},{icon:'✅',label:T('Weil ein einziger Wert immer sicher genug ist','Because one value is always sufficient')}],answer:0,hint:T('Denke an überlappende Messwerte.','Think about overlapping measurements.'),why:T('Mehrere Merkmale und Wiederholungen verbessern die Zuverlässigkeit der Einordnung.','Multiple features and repeats improve classification reliability.')}
]
};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function miniTrace(kind){const base='<svg viewBox="0 0 110 60" aria-hidden="true"><rect width="110" height="60" rx="8" fill="#0b2239"/><path d="M0 18 H110 M0 30 H110 M0 42 H110" stroke="#294b67"/>';const tails='</svg>';const lines={flat:'<path d="M8 18 H102" fill="none" stroke="#77efd1" stroke-width="4"/>',onedip:'<path d="M8 18 H35 V42 H60 V18 H102" fill="none" stroke="#77efd1" stroke-width="4"/>',twodip:'<path d="M8 18 H25 V38 H42 V18 H62 V44 H82 V18 H102" fill="none" stroke="#77efd1" stroke-width="4"/>',noisy:'<path d="M8 27 L16 20 L24 34 L32 18 L40 30 L48 22 L56 36 L64 16 L72 30 L80 20 L88 34 L96 23 L102 29" fill="none" stroke="#77efd1" stroke-width="4"/>',clean:'<path d="M8 20 H35 V40 H55 V20 H102" fill="none" stroke="#77efd1" stroke-width="4"/>',cleanEvent:'<path d="M8 18 H42 V45 H68 V18 H102" fill="none" stroke="#77efd1" stroke-width="4"/>',matchA:'<path d="M8 18 H40 V40 H66 V18 H102" fill="none" stroke="#77efd1" stroke-width="4"/>',matchB:'<path d="M8 18 H28 V44 H50 V18 H72 V36 H102" fill="none" stroke="#77efd1" stroke-width="4"/>',matchC:'<path d="M8 18 H28 V32 H46 V18 H66 V44 H88 V18 H102" fill="none" stroke="#77efd1" stroke-width="4"/>'};return base+lines[kind]+tails;}
function hero(kind){if(kind==='dna')return `<svg class="hero" viewBox="0 0 700 180" role="img" aria-label="DNA illustration"><rect width="700" height="180" fill="#0b2238"/><path d="M60 26 Q120 155 180 26 T300 26 T420 26 T540 26 T660 26" fill="none" stroke="#73f0d2" stroke-width="8"/><path d="M60 154 Q120 25 180 154 T300 154 T420 154 T540 154 T660 154" fill="none" stroke="#c5a8ff" stroke-width="8"/>${Array.from({length:11},(_,i)=>`<path d="M${80+i*54} 58 V122" stroke="#ffd887" stroke-width="4"/>`).join('')}</svg>`;if(kind==='protein')return `<svg class="hero" viewBox="0 0 700 180" role="img" aria-label="Protein illustration"><rect width="700" height="180" fill="#0b2238"/>${Array.from({length:12},(_,i)=>{const x=70+i*48;const y=92+38*Math.sin(i*0.9);const c=['#76d7f8','#b39dff','#79efcf'][i%3];const line=i?`<line x1="${70+(i-1)*48}" y1="${92+38*Math.sin((i-1)*0.9)}" x2="${x}" y2="${y}" stroke="#ffd887" stroke-width="7"/>`:'';return line+`<circle cx="${x}" cy="${y}" r="16" fill="${c}"/>`;}).join('')}</svg>`;if(kind==='pore')return `<svg class="hero" viewBox="0 0 700 180" role="img" aria-label="Nanopore illustration"><rect width="700" height="180" fill="#0b2238"/><rect x="320" width="60" height="62" rx="9" fill="#9497ee"/><rect x="320" y="118" width="60" height="62" rx="9" fill="#9497ee"/><circle cx="210" cy="90" r="30" fill="#ffd887"/><path d="M260 90 H560" stroke="#73f0d2" stroke-width="4" stroke-dasharray="8 9"/><path d="M540 75 L560 90 L540 105" fill="none" stroke="#73f0d2" stroke-width="4"/><g fill="#79d6ef"><circle cx="85" cy="46" r="5"/><circle cx="125" cy="130" r="5"/><circle cx="590" cy="42" r="5"/><circle cx="625" cy="130" r="5"/></g></svg>`;if(kind==='lab')return `<svg class="hero" viewBox="0 0 700 180" role="img" aria-label="Lab illustration"><rect width="700" height="180" fill="#0b2238"/><rect x="70" y="55" width="160" height="85" rx="12" fill="#163b5f" stroke="#73f0d2"/><rect x="260" y="35" width="170" height="105" rx="12" fill="#163b5f" stroke="#b39dff"/><rect x="470" y="68" width="150" height="72" rx="12" fill="#163b5f" stroke="#ffd887"/><path d="M105 110 H195" stroke="#73f0d2" stroke-width="6"/><path d="M290 55 H400 M290 85 H400 M290 115 H380" stroke="#b39dff" stroke-width="6"/><path d="M500 100 H590" stroke="#ffd887" stroke-width="6"/></svg>`;return `<svg class="hero" viewBox="0 0 700 180" role="img" aria-label="Signal illustration"><rect width="700" height="180" fill="#0b2238"/><path d="M0 50 H700 M0 90 H700 M0 130 H700" stroke="#284968"/><path d="M20 50 H170 V120 H300 V50 H440 V105 H560 V50 H680" fill="none" stroke="#73f0d2" stroke-width="6"/></svg>`;}
function choiceHTML(opt,i){const label=opt.label?tx(opt.label):'';const cls=(i===2&&window.innerWidth<780&&label.length>35)?'choice wide':'choice';return `<button class="${cls}" data-opt="${i}" aria-pressed="false">${opt.svg?miniTrace(opt.svg):`<span class="big">${opt.icon||''}</span>`}${label?`<span class="small">${esc(label)}</span>`:''}</button>`;}
function shell(inner){const s=UI[lang];document.documentElement.lang=lang;app.innerHTML=`<header><div class="logo">⚛ Nano<em>Quest</em></div><div class="langs" aria-label="${s.language}"><button class="lang ${lang==='de'?'on':''}" data-lang="de" aria-pressed="${lang==='de'}">DE</button><button class="lang ${lang==='en'?'on':''}" data-lang="en" aria-pressed="${lang==='en'}">EN</button></div></header>${inner}<footer>${s.footer}</footer>`;}
function home(){group=null;const s=UI[lang];shell(`<section class="panel"><div class="eyebrow">${s.tag}</div><h1>${s.headline}</h1><p class="lead">${s.lead}</p><div><span class="chip">18 ${s.missions}</span> <span class="chip">3 ${s.groupsLabel}</span> <span class="chip">DE / EN</span> <span class="chip">iPad</span></div><h2 style="margin-top:22px">${s.choose}</h2><div class="row">${groups.map((g,i)=>`<button class="age" data-age="${g.id}"><span class="icon">${g.emoji}</span><strong>${s.ages[i]}</strong><span class="chip">${g.age}</span><span>${s.descs[i]} · 6 ${s.missions}</span></button>`).join('')}</div></section>`);}
function render(){if(group===null)return home();const s=UI[lang],arr=tasks[group];if(index>=arr.length)return resultPage();const g=groups.find(x=>x.id===group),gIndex=groups.findIndex(x=>x.id===group),m=arr[index];selected=-1;tries=0;done=false;sliderValue=m.init||0;const stage=m.type==='slider'?`<div class="meter"><span>${lang==='de'?'Spannung':'Voltage'}</span><output id="sliderOut">${sliderValue} ${m.unit}</output></div><input id="slider" class="slider" type="range" min="${m.min}" max="${m.max}" step="${m.step}" value="${sliderValue}"><div class="stats"><div>${lang==='de'?'Modellgeschwindigkeit':'Model speed'}<div class="stat" id="calc">${m.formula(sliderValue)}</div></div><div>${s.goal}<div class="stat">3–4</div></div></div>`:`<div class="choices">${m.options.map(choiceHTML).join('')}</div>`;shell(`<div class="topnav"><button class="btn alt" data-action="home">${s.back}</button><span class="chip">${UI[lang].ages[gIndex]} · ${g.age} · ${s.mission} ${index+1}/${arr.length}</span><div style="display:flex;align-items:center;gap:10px"><span class="chip">⭐ ${score} ${s.points}</span><div class="progress"><div style="width:${(index/arr.length)*100}%"></div></div></div></div><section class="panel"><div class="eyebrow">${UI[lang].ages[gIndex]} · ${s.challenge} ${index+1}</div><h2>${tx(m.title)}</h2><p class="lead">${tx(m.q)}</p><div class="stage">${hero(m.art)}${stage}</div><div class="actions"><button class="btn" data-action="check">${s.check}</button><button class="btn alt" data-action="hint">💡 ${s.hint}</button></div><div id="feedback" class="feedback" role="status" aria-live="polite">${s.startText}</div></section>`);}
function feedback(text,type=''){const el=app.querySelector('#feedback');if(el){el.className='feedback'+(type?' '+type:'');el.textContent=text;}}
function checkAnswer(){const s=UI[lang],m=tasks[group][index];let ok=false;if(m.type==='slider'){ok=sliderValue>=m.low&&sliderValue<=m.high;}else{if(selected<0){feedback(s.chooseFirst,'bad');return;}ok=selected===m.answer;}tries++;if(!ok){feedback(s.retry,'bad');return;}done=true;const earned=tries===1?100:70;score+=earned;feedback(`✅ ${s.correct} +${earned} ${s.points}. ${tx(m.why)}`,'good');const actions=app.querySelector('.actions');actions.innerHTML=`<button class="btn" data-action="next">${index===tasks[group].length-1?s.finish:s.next}</button>`;app.querySelectorAll('[data-opt]').forEach(x=>x.disabled=true);}
function resultPage(){const s=UI[lang];shell(`<section class="panel" style="text-align:center"><div class="celebrate">🏆🧬✨</div><div class="eyebrow">${s.well}</div><h1>${s.result}</h1><div class="stat">${score} / 600 ${s.points}</div><p class="lead" style="margin:14px auto">${s.ready}</p><div class="actions" style="justify-content:center"><button class="btn" data-action="replay">↻ ${s.again}</button><button class="btn alt" data-action="home">${s.other}</button></div></section>`);}
app.addEventListener('click',e=>{const b=e.target.closest('[data-lang],[data-age],[data-action],[data-opt]');if(!b)return;if(b.dataset.lang){lang=b.dataset.lang;if(group===null)home();else if(index>=tasks[group].length)resultPage();else render();return;}if(b.dataset.age){group=b.dataset.age;index=0;score=0;render();return;}if(b.dataset.opt!==undefined){if(done)return;selected=+b.dataset.opt;app.querySelectorAll('[data-opt]').forEach(el=>{const on=+el.dataset.opt===selected;el.classList.toggle('selected',on);el.setAttribute('aria-pressed',String(on));});return;}switch(b.dataset.action){case'home':home();break;case'hint':feedback(tx(tasks[group][index].hint));break;case'check':checkAnswer();break;case'next':index++;render();break;case'replay':index=0;score=0;render();break;}});
app.addEventListener('input',e=>{if(e.target.id==='slider'){sliderValue=+e.target.value;const m=tasks[group][index];app.querySelector('#sliderOut').textContent=`${sliderValue} ${m.unit}`;app.querySelector('#calc').textContent=m.formula(sliderValue);}});
home();
})();
</script>
</body>
</html>
