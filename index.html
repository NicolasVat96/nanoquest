<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#08172c"><meta name="description" content="NanoQuest – neun interaktive Minispiele zur Molekularforschung. Für alle Altersgruppen, direkt im Browser."><title>NanoQuest · Forschungsabenteuer</title><style>
:root{color-scheme:dark;--bg:#071629;--pane:#10253d;--pane2:#193751;--line:#335674;--mint:#64f0cb;--gold:#ffd36c;--ink:#effbff;--muted:#b9d2e2;--pink:#fa9bd9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#17375a 0%,#071629 65%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}button,input{font:inherit}button{touch-action:manipulation;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}#app{width:min(100%,1050px);margin:auto;padding:clamp(14px,3vw,28px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{font-weight:950;letter-spacing:-.05em;font-size:clamp(23px,4vw,31px)}.brand b{color:var(--mint)}.toplabel{color:var(--muted);font-size:12px;letter-spacing:.06em}.tag{padding:7px 10px;border-radius:50px;background:#244562;color:#d9f6ff;font-size:12px;font-weight:800}.hero{border:1px solid var(--line);border-radius:24px;background:linear-gradient(120deg,#132d4e,#10243c);padding:clamp(18px,4vw,33px);box-shadow:0 16px 60px #0003}.eyebrow{color:var(--mint);text-transform:uppercase;font-size:12px;letter-spacing:.13em;font-weight:900}h1{font-size:clamp(30px,6.5vw,56px);line-height:1.08;letter-spacing:-.04em;margin:10px 0 14px}h2{font-size:clamp(23px,4vw,35px);line-height:1.2;margin:10px 0}h3{margin:0 0 8px;font-size:20px}.lead{font-size:clamp(16px,2.4vw,19px);color:#d0e5f4;max-width:720px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}.card{background:var(--pane);border:2px solid var(--line);border-radius:19px;padding:20px;color:var(--ink);text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:190px;transition:transform .15s,border-color .15s}.card:hover,.card:focus-visible{border-color:var(--mint);transform:translateY(-2px)}.card .emoji{font-size:44px}.card strong{font-size:21px}.card small{font-size:13px;color:var(--muted)}.card .pill{background:#284d62;border-radius:40px;padding:4px 9px;color:var(--mint);font-size:12px;font-weight:800}.btn{border:1px solid transparent;padding:12px 17px;border-radius:13px;background:var(--mint);color:#082137;font-weight:900;min-height:50px}.btn.secondary{background:#234864;color:white;border-color:#537a96}.btn.outline{background:transparent;border-color:#6387a2;color:#e2f4ff}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.missionHead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:5px 0 13px}.progress{height:9px;background:#23425d;border-radius:50px;overflow:hidden;flex:1;max-width:250px}.progress div{height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));transition:width .2s}.stage{padding:18px;background:#0a2039;border:1px solid #3b5b79;border-radius:20px;margin:18px 0;min-height:220px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{border:2px solid #46708b;background:#153550;color:white;border-radius:16px;padding:13px 9px;min-height:90px;font-weight:750}.choice .big{display:block;font-size:32px}.choice.chosen{border-color:var(--mint);background:#245b64}.choice:disabled{opacity:.55;cursor:default}.feedback{margin-top:15px;border-radius:14px;padding:13px 15px;background:#243d57;border:1px solid #587c95;min-height:56px}.feedback.good{border-color:var(--mint);background:#153d43}.feedback.bad{border-color:var(--gold)}.slider{width:100%;accent-color:var(--mint);min-height:40px}.meter{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:750}.numbers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.number{background:#15334f;border:1px solid #355b77;padding:12px;border-radius:13px}.number b{font-size:clamp(19px,3.2vw,29px);display:block;color:var(--mint)}.note{font-size:13px;color:#c4dbee}.visual{display:block;width:100%;max-height:230px;border-radius:16px;background:#07192d}.bubble{display:inline-block;padding:5px 10px;background:#315579;border-radius:20px;font-size:12px}.results{text-align:center}.stars{font-size:51px;color:var(--gold)}footer{color:#a9c7d9;font-size:12px;text-align:center;padding:20px 0 5px}svg text{font-family:system-ui} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:#bbd8e9}@media(max-width:670px){.grid{grid-template-columns:1fr}.card{min-height:105px;display:grid;grid-template-columns:50px 1fr;align-items:center}.card .emoji{grid-row:span 3}.card strong{font-size:19px}.choices{gap:7px}.choice{padding:11px 5px;font-size:14px}.choice .big{font-size:27px}.stage{padding:12px}.hero{padding:17px}.toplabel{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><script>
(()=>{'use strict';const app=document.querySelector('#app');let age=null,level=0,selected=-1,score=0,tries=0,locked=false,values={};const groups=[{id:'junior',title:'Entdecker',age:'8–11 Jahre',emoji:'🧬',desc:'Wähle Moleküle, baue Sensoren und erkenne Muster.',names:['Molekül-Safari','Baue einen Sensor','Geheimsignal']},{id:'teen',title:'Experimentierer',age:'12–15 Jahre',emoji:'⚡',desc:'Entscheide über Porengröße, Feldstärke und Signalrauschen.',names:['Poren-Design','Transport-Labor','Signal-Detektiv']},{id:'adult',title:'Forschungslabor',age:'16+ & Erwachsene',emoji:'🔬',desc:'Berechne Leitfähigkeit, teste Klassifikatoren und plane Kontrollen.',names:['Strom berechnen','Signale klassifizieren','Experiment planen']}];const tasks={junior:[{title:'Molekül-Safari',intro:'Eine DNA-Doppelhelix ist die bekannte gedrehte Leiter. Welches Objekt ist DNA?',hint:'DNA besteht aus zwei umeinander gewundenen Strängen.',answers:['💧|Wasser','🧬|DNA','🍬|Zucker'],correct:1,why:'DNA besitzt typischerweise zwei komplementäre Stränge. Ein Molekül kann in der Wirklichkeit viel komplexer aussehen als dieses Symbol.'},{title:'Baue einen Sensor',intro:'Ein großes Modellmolekül (10 nm) soll durch eine Öffnung passen. Welche Modellpore ist groß genug?',hint:'Vergleiche die Größen in Nanometern.',answers:['🔹|3 nm','🔸|7 nm','🟢|12 nm'],correct:2,why:'Im einfachen Größenmodell passt das 10-nm-Objekt durch 12 nm. Bei echten Molekülen beeinflussen Form, Ladung und Flexibilität den Transport.'},{title:'Geheimsignal',intro:'Ein Molekül verändert zweimal den Ionenstrom. Welcher Verlauf zeigt ZWEI deutlich getrennte Einbrüche?',hint:'Ein Einbruch bedeutet, dass die gemessene Stromstärke kurz abnimmt.',answers:['📉|Ein Einbruch','📊|Zwei Einbrüche','〰️|Kein Einbruch'],correct:1,why:'Beim Nanopore-Sensing sind Stromänderungen Messhinweise. Ein einzelnes Signal identifiziert normalerweise nicht eindeutig ein bestimmtes Molekül.'}],teen:[{title:'Poren-Design',intro:'Du willst ein 3-nm-Partikel mit einer einfachen starren Modellpore durchlassen und größere Teilchen möglichst aussperren. Wähle den engsten geeigneten Durchmesser.',answers:['2 nm','4 nm','12 nm'],correct:1,hint:'Zu klein blockiert. Zu groß lässt mehr unterschiedliche Partikel passieren.',why:'4 nm ist der kleinste angebotene Durchmesser größer als 3 nm. In echten Nanoporen sind Geometrie, Beschichtungen und Wechselwirkungen ebenfalls entscheidend.'},{title:'Transport-Labor',intro:'Verändere die Spannung. Erreiche im Modell einen Driftgeschwindigkeitsbereich von 3–5 Einheiten. Die gezeigte Geschwindigkeit wächst hier proportional zur Spannung.',type:'voltage',why:'Ein elektrisches Feld kann geladene Moleküle transportieren. Die Beziehung ist in Wirklichkeit von Elektroosmose, Reibung, Porengeometrie und weiteren Größen abhängig.'},{title:'Signal-Detektiv',intro:'Du misst einen Strom von 100 pA ohne Molekül und 65 pA während des Ereignisses. Wie groß ist die relative Stromblockade?',answers:['15 %','35 %','65 %'],correct:1,hint:'Anteil der Abnahme am Strom ohne Molekül.',why:'(100 − 65) / 100 = 0,35, also 35 %. In realen Experimenten werden zusätzlich Ereignisdauer, Schwankungen und Hintergrundrauschen analysiert.'}],adult:[{title:'Strom berechnen',intro:'Ohmsches Modell: Eine Pore hat einen Leitwert von 2 nS. Bei 100 mV beträgt der erwartete Strom I = G·V. Welcher Wert ist richtig?',answers:['20 pA','200 pA','2 nA'],correct:1,hint:'1 nS · 1 mV = 1 pA.',why:'2 nS × 100 mV = 200 pA. Das ist eine ideale lineare Näherung, keine universelle Kalibration realer Nanoporen.'},{title:'Signale klassifizieren',intro:'Du vergleichst zwei hypothetische Molekülklassen. Klasse A: 35 ± 5 % Blockade. Klasse B: 55 ± 5 %. Für eine Messung mit 52 %: welche Klasse ist anhand des Mittelwertabstands naheliegender?',answers:['Klasse A','Klasse B','Nicht entscheidbar durch Daten'],correct:1,hint:'Vergleiche |52−35| mit |52−55|.',why:'52 % liegt 3 Prozentpunkte von B und 17 Prozentpunkte von A entfernt. Das ist eine Klassifikation nach Nähe zum Mittelwert, keine gesicherte Molekülidentität.'},{title:'Experiment planen',intro:'Du vermutest, dass DNA-Ereignisse die Stromblockaden verursachen. Welcher Kontrollvergleich prüft diese Aussage am direktesten?',answers:['Puffer ohne DNA gegen denselben Puffer mit DNA','Nur dieselbe DNA-Probe zehnmal ohne Pufferkontrolle','Zwei unterschiedliche Bildschirmfarben vergleichen'],correct:0,hint:'Eine Kontrollmessung unterscheidet sich möglichst nur in einem überprüften Faktor.',why:'Eine Puffer-Leermessung und eine DNA-haltige Messung bei sonst gleichen Bedingungen helfen, Hintergrundereignisse von DNA-assoziierten Ereignissen zu unterscheiden.'}]};function html(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function shell(body){app.innerHTML=`<header><div><div class="brand">⚛ Nano<b>Quest</b></div><div class="toplabel">DIE WELT DER MOLEKÜLE ERFORSCHEN</div></div><span class="tag">DE · iPad · Offline</span></header>${body}<footer>Eigenständiges Wissenschafts-Lernspiel · Schematische Lehrmodelle, keine Messdaten · Keine Datenerhebung oder externen Bibliotheken</footer>`}function home(){age=null;shell(`<section class="hero"><div class="eyebrow">Interaktives Wissenschaftsabenteuer</div><h1>Winzige Moleküle.<br>Große Entdeckungen.</h1><p class="lead">Wie erkennt man DNA oder Proteine, obwohl man sie nicht sehen kann? Erforsche Nanoporen, elektrische Signale und die Methoden von Forschenden – in deinem eigenen Tempo.</p><span class="bubble">9 Missionen</span> <span class="bubble">3 Altersgruppen</span> <span class="bubble">Ohne Installation</span><h2>Wähle deine Altersgruppe</h2><div class="grid">${groups.map(g=>`<button class="card" data-age="${g.id}"><span class="emoji">${g.emoji}</span><strong>${g.title}</strong><span class="pill">${g.age}</span><small>${g.desc}</small></button>`).join('')}</div><p class="note">Jede Altersgruppe hat drei eigene Minispiele. Deine Antworten werden nicht gespeichert oder übertragen.</p></section>`)}function start(g){age=g;level=0;score=0;tries=0;mission()}function selectUI(options){return `<div class="choices">${options.map((a,i)=>{let parts=a.split('|');return `<button class="choice" data-select="${i}" aria-pressed="false">${parts.length===2?`<span class="big">${parts[0]}</span>${html(parts[1])}`:html(a)}</button>`}).join('')}</div>`}function poreSVG(){return `<svg class="visual" viewBox="0 0 620 180" role="img" aria-label="Ein Molekül bewegt sich auf eine Membran mit einer kleinen Öffnung zu"><defs><linearGradient id="mem" x1="0" x2="1"><stop stop-color="#7770cc"/><stop offset="1" stop-color="#51b3b2"/></linearGradient></defs><rect width="620" height="180" rx="12" fill="#091e35"/><rect x="280" y="5" width="30" height="57" rx="7" fill="url(#mem)"/><rect x="280" y="110" width="30" height="65" rx="7" fill="url(#mem)"/><path d="M210 55 C230 75 192 92 215 110 S245 135 232 147" fill="none" stroke="#ffd46f" stroke-width="9" stroke-linecap="round"/><path d="M236 55 C216 75 254 92 231 110 S201 135 214 147" fill="none" stroke="#70efd5" stroke-width="9" stroke-linecap="round"/><path d="M220 64 L227 64 M219 84 L230 84 M220 104 L228 104 M220 125 L225 125" stroke="white" stroke-width="4"/><g fill="#78dcf1" opacity=".85"><circle cx="380" cy="30" r="5"/><circle cx="413" cy="67" r="5"/><circle cx="350" cy="135" r="5"/><circle cx="500" cy="110" r="5"/></g><text x="24" y="25" fill="#cfebfb" font-size="16">Molekül</text><text x="333" y="25" fill="#cfebfb" font-size="16">Ionen im Elektrolyt</text><text x="325" y="96" fill="#64f0cb" font-size="16">Nanopore</text></svg>`}function waveSVG(block=35,noise=0){const pts=[];for(let i=0;i<=95;i++){let y=28+((i>20&&i<65)?block*.95:0)+Math.sin(i*1.53)*noise+Math.sin(i*.48)*noise*.5;pts.push(`${i*6.35},${y.toFixed(1)}`)}return `<svg class="visual" viewBox="0 0 620 130" role="img" aria-label="Schematischer Ionenstrom über der Zeit"><path d="M10 25H610 M10 60H610 M10 95H610" stroke="#2a4965" fill="none"/><polyline points="${pts.join(' ')}" fill="none" stroke="#6ceacb" stroke-width="3" stroke-linejoin="round"/><text x="12" y="118" font-size="13" fill="#d0e8f7">Zeit →</text><text x="13" y="16" font-size="12" fill="#d0e8f7">Strom (schematisch)</text></svg>`}function doubleDipSVG(){return `<svg class="visual" viewBox="0 0 620 130" role="img" aria-label="Beispiel für zwei zeitlich getrennte kurze Stromblockaden"><path d="M10 28H135V85H220V28H370V85H460V28H610" stroke="#6ceacb" stroke-width="4" fill="none"/><text x="12" y="117" fill="#b9d2e2" font-size="14">Zwei Strom-Einbrüche als Beispiel</text></svg>`}function mission(){selected=-1;locked=false;const g=groups.find(x=>x.id===age),m=tasks[age][level];const graphic=age==='junior'&&level===2?doubleDipSVG():((age==='teen'&&level===2)||(age==='adult'&&level===1)?waveSVG(age==='adult'?49:38,age==='adult'?5:1):poreSVG());let interaction=m.type==='voltage'?`<label for="volt" class="meter"><span>⚡ Spannung im Modell</span><output id="voltText">40 mV</output></label><input class="slider" id="volt" type="range" min="0" max="100" step="5" value="40"><div class="numbers"><div class="number">Driftgeschwindigkeit<b id="speed">2,0</b><span class="note">Modell-Einheiten</span></div><div class="number">Zielbereich<b>3,0–5,0</b><span class="note">Modell-Einheiten</span></div></div>`:selectUI(m.answers);shell(`<div class="missionHead"><button class="btn outline" data-action="back">← Alterswahl</button><span class="tag">${g.age} · Mission ${level+1}/3 · ⭐ ${score}</span><div class="progress" aria-label="Fortschritt"><div style="width:${(level/3)*100}%"></div></div></div><section class="hero"><div class="eyebrow">${g.emoji} ${g.title} · ${g.names[level]}</div><h2>${m.title}</h2><p class="lead">${m.intro}</p><div class="stage">${graphic}<div style="margin-top:17px">${interaction}</div></div><div class="row"><button class="btn" data-action="check">Antwort prüfen →</button><button class="btn secondary" data-action="hint">💡 Hinweis</button></div><div class="feedback" id="feedback" role="status" aria-live="polite">Probiere etwas aus und überprüfe dein Ergebnis.</div></section>`);if(m.type==='voltage'){app.querySelector('#volt').addEventListener('input',e=>{let v=+e.target.value;app.querySelector('#voltText').textContent=v+' mV';app.querySelector('#speed').textContent=(v*.05).toFixed(1).replace('.',',')})}}function feedback(message,kind){let el=app.querySelector('#feedback');if(!el)return;el.className='feedback '+kind;el.textContent=message}function next(){if(level===2){finish()}else{level++;mission()}}function check(){if(locked)return;const m=tasks[age][level];const correct=m.type==='voltage'?(()=>{let v=+app.querySelector('#volt').value;return v>=60&&v<=100})():selected===m.correct;if(m.type!=='voltage'&&selected===-1){feedback('Wähle zuerst eine Antwort.','bad');return}tries++;if(correct){locked=true;score+=tries===1?100:60;const f=app.querySelector('#feedback');f.className='feedback good';f.innerHTML=`<strong>✅ Richtig! ${tries===1?'100':'60'} Punkte.</strong><div class="note" style="margin-top:7px">${m.why}</div><div class="actions"><button class="btn" data-action="next">${level===2?'Ergebnis ansehen':'Nächste Mission →'}</button></div>`;app.querySelectorAll('[data-select]').forEach(x=>x.disabled=true)}else{feedback('Noch nicht ganz. Probiere eine andere Lösung – Fehler gehören zur Forschung!','bad')}}function finish(){let g=groups.find(x=>x.id===age);shell(`<section class="hero results"><div class="eyebrow">Mission abgeschlossen</div><div class="stars">${score>=260?'⭐⭐⭐':score>=180?'⭐⭐':'⭐'}</div><h1>Forschungsteam gerettet!</h1><p class="lead" style="margin:auto">Du hast ${g.names.map(x=>`„${x}“`).join(', ')} gemeistert.</p><div class="numbers" style="max-width:500px;margin:22px auto"><div class="number">Punkte<b>${score} / 300</b></div><div class="number">Wissen<b>+3 Missionen</b></div></div><p>Wichtig: Die Spielmodelle erklären ausgewählte Prinzipien. Echte Nanoporenmessungen sind komplexer und benötigen Kalibrierung, Kontrollen und statistische Auswertung.</p><div class="actions" style="justify-content:center"><button class="btn" data-action="replay">🔁 Nochmals spielen</button><button class="btn secondary" data-action="back">Andere Altersgruppe →</button></div></section>`)}app.addEventListener('click',e=>{let el=e.target.closest('[data-age],[data-action],[data-select]');if(!el)return;if(el.dataset.age){start(el.dataset.age);return}if(el.dataset.select!==undefined){if(locked)return;selected=+el.dataset.select;app.querySelectorAll('[data-select]').forEach(x=>{let yes=+x.dataset.select===selected;x.classList.toggle('chosen',yes);x.setAttribute('aria-pressed',yes?'true':'false')});return}let act=el.dataset.action;if(act==='back')home();if(act==='check')check();if(act==='hint')feedback(tasks[age][level].hint||'Überlege, welche Größe sich in dem Experiment verändert und was konstant bleibt.','');if(act==='next'){tries=0;next()}if(act==='replay')start(age)});home()})();
</script></body></html>
