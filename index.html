<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08162b"><title>NanoQuest | Molecular Adventures</title><style>
:root{color-scheme:dark;--bg:#071426;--panel:#102944;--panel2:#193957;--line:#395b78;--green:#72f2d1;--gold:#ffda86;--ink:#f2faff;--muted:#c1d8e9}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 15% -10%,#204a76,#071426 65%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}#app{width:min(1050px,100%);margin:auto;padding:clamp(12px,3vw,28px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.logo{font-size:clamp(25px,4vw,33px);font-weight:950;letter-spacing:-1.4px}.logo em{color:var(--green);font-style:normal}.langs{display:flex;gap:5px;background:#122b47;border:1px solid var(--line);padding:5px;border-radius:14px}.lang{border:0;color:#e0f3ff;background:transparent;border-radius:9px;padding:9px 13px;font-weight:850;min-width:51px}.lang.on{background:var(--green);color:#082037}.panel{border:1px solid var(--line);border-radius:25px;padding:clamp(16px,4vw,32px);background:linear-gradient(130deg,#153351,#0d2139);box-shadow:0 20px 55px #0004}.eyebrow{color:var(--green);font-weight:900;text-transform:uppercase;letter-spacing:.13em;font-size:12px}h1{font-size:clamp(30px,6vw,52px);line-height:1.11;margin:10px 0 15px;letter-spacing:-.035em}h2{font-size:clamp(24px,4vw,34px);line-height:1.2;margin:10px 0}p{color:#e0eff9}.lead{font-size:clamp(16px,2.3vw,19px);max-width:780px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:20px 0}.agecard{min-height:175px;padding:20px;text-align:left;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:8px}.agecard:hover,.agecard:focus-visible,.choice.selected{border-color:var(--green);background:#215265}.agecard strong{font-size:22px}.agecard small{color:var(--muted)}.agecard .emoji{font-size:41px}.chip{display:inline-block;background:#254b67;color:#e4faff;border-radius:25px;padding:5px 10px;font-size:12px;font-weight:850}.btn{border:1px solid transparent;border-radius:13px;padding:12px 18px;min-height:49px;font-weight:850;background:var(--green);color:#07243a}.btn.alt{background:#244e6d;border-color:#4d7793;color:white}.btn:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.stage{margin:18px 0;background:#071e36;border:1px solid #3b617e;border-radius:18px;padding:clamp(12px,3vw,22px)}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.choice{border:2px solid #49708d;border-radius:17px;background:#163653;color:#fff;min-height:100px;padding:14px 9px;font-weight:800}.choice .big{font-size:42px;display:block}.choice .small{display:block;font-size:14px;margin-top:8px}.feedback{border:1px solid #466d87;border-radius:12px;padding:15px;background:#183751;min-height:53px;margin-top:16px;line-height:1.5}.feedback.good{border-color:var(--green);background:#153d3c}.feedback.bad{border-color:var(--gold)}.heroart{width:100%;height:auto;max-height:210px;display:block;background:#091c32;border-radius:13px}.meter{display:flex;justify-content:space-between;font-weight:850;gap:10px}.slider{width:100%;accent-color:var(--green);height:45px}.stat{font-size:25px;font-weight:900;color:var(--green)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.stats>div{background:#153753;border:1px solid #416281;border-radius:12px;padding:12px}.nav{display:flex;gap:9px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:0 0 14px}.progress{height:10px;background:#2c4962;border-radius:30px;overflow:hidden;width:min(200px,35vw)}.progress>div{height:100%;background:var(--green)}footer{text-align:center;color:#a9c8da;font-size:12px;padding:20px 5px}.celebrate{text-align:center;font-size:72px}.sub{font-size:13px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.agecard{min-height:90px;display:grid;grid-template-columns:54px 1fr;gap:4px;align-items:center}.agecard .emoji{grid-row:span 3}.choices{gap:7px}.choice{padding:12px 5px;font-size:14px}.choice .big{font-size:33px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><script>
(()=>{'use strict';const app=document.getElementById('app');let lang='de',group=null,index=0,selected=-1,tries=0,score=0,done=false,sliderValue=0;
const I={de:{tag:'Wissenschaft zum Mitspielen',headline:'Winzige Moleküle. Große Entdeckungen.',lead:'Entdecke DNA, Proteine, Nanoporen und die Signale, mit denen Forschende Moleküle untersuchen. Wähle dein Alter und starte deine eigene Mission!',choose:'Wähle deine Altersgruppe',missions:'Missionen',ages:['Entdecker','Experimentierer','Forschungslabor'],descs:['Bilderrätsel, Moleküle und Sensormissionen.','Porengrößen, Spannung, Signale und Berechnungen.','Messdaten, Kontrollen und computergestützte Analyse.'],back:'← Alterswahl',question:'Aufgabe',check:'Antwort prüfen',hint:'Tipp',next:'Nächste Mission →',finish:'Ergebnis ansehen →',chooseFirst:'Wähle zuerst eine Antwort.',retry:'Noch nicht! Prüfe deine Beobachtung und versuche es erneut.',startFeedback:'Untersuche das Problem und prüfe deine Lösung.',correct:'Richtig!',points:'Punkte',goal:'Dein Ziel',end:'Mission abgeschlossen!',again:'Noch einmal spielen',other:'Andere Altersgruppe',note:'Vereinfachte Lernmodelle, keine echten Forschungsdaten. Kein Login, keine Werbung, keine Datenerhebung.',ready:'Alles bereit für neue Entdeckungen!',of:'von',visual:'Schematische Darstellung',toggle:'Sprache',complete:'Geschafft!',mission:'Mission'},en:{tag:'Hands-on science',headline:'Tiny molecules. Big discoveries.',lead:'Explore DNA, proteins, nanopores, and the signals researchers use to investigate molecules. Choose your age group and start your own mission!',choose:'Choose your age group',missions:'missions',ages:['Explorers','Experimenters','Research Lab'],descs:['Picture puzzles, molecules, and sensor challenges.','Pore sizes, voltage, signals, and calculations.','Measurements, controls, and computational analysis.'],back:'← Age selection',question:'Challenge',check:'Check answer',hint:'Hint',next:'Next mission →',finish:'See results →',chooseFirst:'Choose an answer first.',retry:'Not quite! Look at the evidence and try again.',startFeedback:'Explore the challenge and check your answer.',correct:'Correct!',points:'points',goal:'Your target',end:'Mission complete!',again:'Play again',other:'Other age group',note:'Simplified teaching models, not real research data. No login, ads, or data collection.',ready:'Ready for another discovery!',of:'of',visual:'Schematic illustration',toggle:'Language',complete:'Well done!',mission:'Mission'}};
const t=(de,en)=>({de,en});
const groups=[{id:'junior',age:'8–11',emoji:'🧬'},{id:'teen',age:'12–15',emoji:'⚡'},{id:'adult',age:'16+',emoji:'🔬'}];
const tasks={junior:[
{title:t('DNA-Detektiv','DNA Detective'),q:t('Welches der drei Bilder zeigt DNA?','Which of these three pictures shows DNA?'),options:[{icon:'💧',label:t('','')},{icon:'🧬',label:t('','')},{icon:'🍬',label:t('','')}],answer:1,hint:t('Suche die Form, die wie eine gedrehte Leiter aussieht.','Look for the shape that resembles a twisted ladder.'),why:t('DNA ist häufig eine Doppelhelix: zwei Stränge, die sich umeinander winden. Die Symbole sind stark vereinfacht.','DNA often forms a double helix: two strands twisting around each other. These icons are simplified.'),art:'dna'},
{title:t('Moleküle erkennen','Meet the molecules'),q:t('Was trägt bei uns meistens die Erbinformation?','What usually carries hereditary information in humans?'),options:[{icon:'🧬',label:t('DNA','DNA')},{icon:'🧈',label:t('Fett','Fat')},{icon:'💧',label:t('Wasser','Water')}],answer:0,hint:t('Denke an die Bauanleitung in unseren Zellen.','Think about the instructions in our cells.'),why:t('Unsere Gene liegen überwiegend als DNA vor.','Our genes are stored primarily in DNA.'),art:'dna'},
{title:t('Baue einen Nanokanal','Build a tiny channel'),q:t('Im vereinfachten Modell ist ein rundes Kügelchen 8 nm breit. Welche Öffnung ist groß genug?','In this simplified model a rigid sphere is 8 nm wide. Which opening is large enough?'),options:[{icon:'🔵',label:t('3 nm','3 nm')},{icon:'🟡',label:t('6 nm','6 nm')},{icon:'🟢',label:t('10 nm','10 nm')}],answer:2,hint:t('Die Öffnung muss breiter als das Kügelchen sein.','The opening must be wider than the sphere.'),why:t('10 nm ist größer als 8 nm. Echte Moleküle sind oft verformbar und wechselwirken mit der Pore.','10 nm is larger than 8 nm. Real molecules can deform and interact with pore surfaces.'),art:'pore'},
{title:t('Strom-Geheimnis','Current mystery'),q:t('Welches Bild zeigt ZWEI getrennte kurze Stromabfälle?','Which picture shows TWO separate brief current drops?'),options:[{icon:'📉',label:t('Ein Abfall','One drop')},{icon:'〽️',label:t('Zwei Abfälle','Two drops')},{icon:'➖',label:t('Kein Abfall','No drop')}],answer:1,hint:t('Zähle, wie oft die Kurve nach unten springt.','Count how many times the curve drops.'),why:t('Zwei getrennte Ereignisse erzeugen hier zwei Stromabfälle. In der Realität brauchen wir Kontrollen, um die Ursache zu bestimmen.','Two separated events create two drops in this model. Real experiments need controls to identify their cause.'),art:'wave'},
{title:t('Protein-Forscher','Protein Explorer'),q:t('Woraus sind Proteine als Ketten aufgebaut?','What are protein chains made of?'),options:[{icon:'🟣',label:t('Aminosäuren','Amino acids')},{icon:'🟦',label:t('Nur Wasser','Only water')},{icon:'⚪',label:t('Nur Salz','Only salt')}],answer:0,hint:t('Suche nach den Bausteinen, die in einer Reihenfolge verbunden werden.','Think about molecular building blocks joined in a sequence.'),why:t('Proteine bestehen aus Aminosäuren, die durch Peptidbindungen verbunden sind.','Proteins contain amino acids connected by peptide bonds.'),art:'protein'},
{title:t('Signal-Retter','Signal Rescue'),q:t('Welche Veränderung zeigt im Modell, dass etwas den Ionenstrom beeinflusst hat?','Which change suggests that something affected the ionic current in this model?'),options:[{icon:'📉',label:t('Ein messbarer Abfall','A measurable drop')},{icon:'⚪',label:t('Nur die Hintergrundfarbe','Only the background color')},{icon:'🧩',label:t('Der Titel des Spiels','The game title')}],answer:0,hint:t('Ein Sensor liefert ein messbares Signal, nicht bloß eine Farbe.','A sensor provides a measured signal, not just a color.'),why:t('Ein Stromabfall kann auf ein Ereignis im Nanoporenkanal hindeuten, identifiziert aber allein noch kein Molekül.','A current drop may indicate a nanopore event, but alone does not identify a molecule.'),art:'wave'}],teen:[
{title:t('Poren-Architekt','Pore Architect'),q:t('Ein starres Modellteilchen misst 4 nm. Welche der verfügbaren Öffnungen lässt es durch und ist am engsten?','A rigid model particle is 4 nm wide. Which available opening admits it and is the narrowest?'),options:['3 nm','5 nm','15 nm'],answer:1,hint:t('Wähle die kleinste Öffnung über 4 nm.','Find the smallest opening above 4 nm.'),why:t('5 nm ist die kleinste angebotene Öffnung, die größer als 4 nm ist. Das gilt nur für dieses starre Geometriemodell.','5 nm is the smallest available opening exceeding 4 nm, in this rigid geometry model.'),art:'pore'},
{title:t('Elektrisches Feld','Electric Field'),q:t('Bewege den Regler: Im Modell gilt v = 0,05 × U. Erreiche eine Geschwindigkeit zwischen 3 und 4 Einheiten.','Move the slider: in this model v = 0.05 × U. Reach a speed between 3 and 4 units.'),type:'slider',min:0,max:100,step:5,init:40,low:60,high:80,unit:'mV',formula:v=>(v*.05).toFixed(2),hint:t('Probiere eine Spannung zwischen 60 und 80 mV.','Try a voltage between 60 and 80 mV.'),why:t('Geladene Moleküle können durch elektrische Felder bewegt werden; in echten Poren wirken auch andere Kräfte.','Electric fields can drive charged molecules, but many other forces matter in real pores.'),art:'pore'},
{title:t('Blockade berechnen','Calculate blockade'),q:t('Ohne DNA misst du 100 pA, während eines Ereignisses 70 pA. Wie groß ist die relative Blockade?','You measure 100 pA without DNA and 70 pA during an event. What is the relative blockade?'),options:['20 %','30 %','70 %'],answer:1,hint:t('Berechne die Abnahme relativ zum Ausgangswert.','Find the decrease as a share of the baseline.'),why:t('(100 − 70) / 100 = 0,30 = 30 %.','(100 − 70) / 100 = 0.30 = 30%.'),art:'wave'},
{title:t('Signal oder Rauschen?','Signal or noise?'),q:t('Was hilft am meisten zu überprüfen, ob ein Stromabfall durch ein Molekül verursacht wurde?','Which comparison best helps test whether a current drop was caused by a molecule?'),options:[t('Eine Leermessung ohne Molekül','A blank measurement without molecules'),t('Nur die Farbe der Grafik ändern','Only change the graph color'),t('Ohne Vergleich raten','Guess with no comparison')],answer:0,hint:t('Forschende messen zunächst den Hintergrund.','Scientists first characterize the background.'),why:t('Die Leermessung hilft, Hintergrundereignisse und Rauschen von molekülbezogenen Ereignissen zu trennen.','A blank helps distinguish background events and noise from molecule-associated events.'),art:'wave'},
{title:t('DNA und Ladung','DNA and charge'),q:t('Warum kann ein elektrisches Feld DNA in Elektrolytlösung bewegen?','Why can an electric field move DNA in an electrolyte?'),options:[t('DNA ist gewöhnlich negativ geladen','DNA normally carries negative charge'),t('DNA leuchtet immer','DNA always glows'),t('DNA ist ein Magnet','DNA is a magnet')],answer:0,hint:t('Betrachte das Zucker-Phosphat-Rückgrat.','Think about the sugar–phosphate backbone.'),why:t('Die Phosphatgruppen verleihen DNA meist eine negative Nettoladung. Elektroosmose und andere Effekte beeinflussen das reale Verhalten.','Phosphate groups generally give DNA a negative net charge. Electroosmosis and other effects influence its actual behavior.'),art:'dna'},
{title:t('Messzeit wählen','Choose measurement duration'),q:t('Ein Ereignis dauert 2 ms. Welche Abtastrate liefert im Idealfall 20 Abtastpunkte während des Ereignisses?','An event lasts 2 ms. Which sampling rate ideally yields 20 samples during the event?'),options:['1 kHz','10 kHz','100 Hz'],answer:1,hint:t('Abtastrate = Anzahl der Punkte geteilt durch Zeit in Sekunden.','Sampling rate = number of samples divided by time in seconds.'),why:t('20 / 0,002 s = 10 000/s = 10 kHz; reale Bandbreite und Filterung spielen zusätzlich eine Rolle.','20 / 0.002 s = 10,000 samples/s = 10 kHz; actual bandwidth and filtering also matter.'),art:'wave'}],adult:[
{title:t('Leitwert-Labor','Conductance Lab'),q:t('Ein linearer Modellkanal hat G = 2 nS. Wie groß ist der Strom bei U = 100 mV?','A linear model channel has G = 2 nS. What is the current at U = 100 mV?'),options:['20 pA','200 pA','2 pA'],answer:1,hint:t('1 nS × 1 mV = 1 pA.','1 nS × 1 mV = 1 pA.'),why:t('I = G × U = 2 nS × 100 mV = 200 pA.','I = G × U = 2 nS × 100 mV = 200 pA.'),art:'wave'},
{title:t('Rauschkontrolle','Noise control'),q:t('Was ist der beste erste Kontrollversuch, um Ereignisse einer DNA-Zugabe zuzuordnen?','What is the best first control to associate events with added DNA?'),options:[t('Puffer ohne und mit DNA vergleichen','Compare buffer without and with DNA'),t('Nur die DNA-Konzentration erhöhen','Only increase DNA concentration'),t('Die Achsenfarben vertauschen','Swap the axis colors')],answer:0,hint:t('Ändere idealerweise nur einen experimentellen Faktor.','Ideally vary only one experimental factor.'),why:t('Ein gepaarter Puffer-Kontrollvergleich unter gleichen Bedingungen prüft den DNA-Beitrag.','A matched buffer control under equal conditions helps assess the contribution of DNA.'),art:'pore'},
{title:t('Klassifikation','Classification'),q:t('Klasse A hat eine mittlere Blockade von 35 %, B von 55 %. Welcher Klasse liegt eine Messung bei 52 % näher?','Class A has a mean blockade of 35%, B of 55%. Which class mean is closer to a measurement at 52%?'),options:[t('Klasse A','Class A'),t('Klasse B','Class B'),t('Beiden gleich nah','Equally close to both')],answer:1,hint:t('Vergleiche die absoluten Abstände.','Compare the absolute differences.'),why:t('Der Abstand beträgt 17 Prozentpunkte zu A und 3 zu B; Nähe zum Mittelwert allein beweist keine Identität.','The distances are 17 percentage points to A and 3 to B; proximity alone does not establish identity.'),art:'wave'},
{title:t('Signal-Rausch-Verhältnis','Signal-to-noise ratio'),q:t('Ein Signalhub beträgt 30 pA und das RMS-Hintergrundrauschen 5 pA. Wie groß ist das Verhältnis Signalhub/RMS-Rauschen?','A signal amplitude is 30 pA and background RMS noise is 5 pA. What is amplitude divided by RMS noise?'),options:['3','6','25'],answer:1,hint:t('Teile die Signalamplitude durch die RMS-Rauschamplitude.','Divide the signal amplitude by the RMS noise amplitude.'),why:t('30 pA / 5 pA = 6. Diese vereinfachte Verhältnisdefinition ist hier ausdrücklich vorgegeben.','30 pA / 5 pA = 6, using the explicit simplified ratio in the question.'),art:'wave'},
{title:t('Bayes-Detektiv','Bayes Detective'),q:t('In einer Stichprobe sind 20 % der Ereignisse Klasse A. Der Test erkennt A mit 90 % Sensitivität und hat 10 % falsch-positive A-Befunde unter Nicht-A. Wie groß ist P(A | positives Ergebnis)?','In a sample, 20% of events are A. The test has 90% sensitivity for A and 10% false positive A calls among non-A. What is P(A | positive)?'),options:['20 %','69,2 %|69.2%','90 %'],answer:1,hint:t('Nutze richtige Positive / alle positiven Befunde.','Use true positives / all positive calls.'),why:t('P(A|+) = (0,9×0,2)/(0,9×0,2 + 0,1×0,8) = 0,18/0,26 ≈ 69,2 %.','P(A|+) = (0.9×0.2)/(0.9×0.2 + 0.1×0.8) = 0.18/0.26 ≈ 69.2%.'),art:'wave'},
{title:t('Schätzungen und Unsicherheit','Estimates and uncertainty'),q:t('Warum sollten wir ein Molekül NICHT ausschließlich über eine einzige Blockade-Amplitude identifizieren?','Why should we NOT identify a molecule from a single blockade amplitude alone?'),options:[t('Verschiedene Moleküle können ähnliche Signale erzeugen','Different molecules may yield similar signals'),t('Der Ionenstrom ist nie messbar','Ionic current can never be measured'),t('Nanoporen brauchen keinen Vergleich','Nanopores never need controls')],answer:0,hint:t('Denke an Überlappungen von Signalverteilungen.','Think about overlapping signal distributions.'),why:t('Signale variieren und können überlappen; Zeitverläufe, Kontrollen und Statistik verbessern die Aussagekraft.','Signals vary and distributions can overlap; time courses, controls, and statistics improve interpretation.'),art:'wave'}]};
function tx(v){if(typeof v==='string'){let p=v.split('|');return (lang==='en'&&p[1])?p[1]:p[0]}return v?.[lang]??''}function escape(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ui(){return I[lang]}
function shell(body){document.documentElement.lang=lang;const s=ui();app.innerHTML=`<header><div class="logo">⚛ Nano<em>Quest</em></div><div class="langs" aria-label="${s.toggle}"><button class="lang ${lang==='de'?'on':''}" data-lang="de" aria-pressed="${lang==='de'}">DE</button><button class="lang ${lang==='en'?'on':''}" data-lang="en" aria-pressed="${lang==='en'}">EN</button></div></header>${body}<footer>${s.note}</footer>`}
function home(){group=null;const s=ui();shell(`<section class="panel"><div class="eyebrow">${s.tag}</div><h1>${s.headline}</h1><p class="lead">${s.lead}</p><span class="chip">18 ${s.missions}</span> <span class="chip">3 ${s.ages.length===3?(lang==='de'?'Altersgruppen':'age groups'):''}</span> <span class="chip">iPad · Offline</span><h2>${s.choose}</h2><div class="grid">${groups.map((g,i)=>`<button class="agecard" data-age="${g.id}"><span class="emoji">${g.emoji}</span><strong>${s.ages[i]}</strong><span class="chip">${g.age}</span><small>${s.descs[i]} · 6 ${s.missions}</small></button>`).join('')}</div></section>`)}
function art(which){if(which==='dna')return `<svg class="heroart" viewBox="0 0 650 150" role="img" aria-label="DNA"><rect width="650" height="150" fill="#0a1e34"/><path d="M40 20 Q100 135 160 20 T280 20 T400 20 T520 20 T640 20" fill="none" stroke="#73efcf" stroke-width="8"/><path d="M40 130 Q100 15 160 130 T280 130 T400 130 T520 130 T640 130" fill="none" stroke="#c2a1ff" stroke-width="8"/>${Array.from({length:13},(_,i)=>{let x=40+i*48,y=75-55*Math.cos(i*48*Math.PI/120);return `<path d="M${x} ${y} V${150-y}" stroke="#ffdb88" stroke-width="4"/>`}).join('')}</svg>`;if(which==='protein')return `<svg class="heroart" viewBox="0 0 650 150" role="img" aria-label="Protein chain"><rect width="650" height="150" fill="#0a1e34"/>${Array.from({length:13},(_,i)=>{let x=40+i*46,y=74+38*Math.sin(i*1.6);return `${i?`<line x1="${x-46}" y1="${74+38*Math.sin((i-1)*1.6)}" x2="${x}" y2="${y}" stroke="#ffcc80" stroke-width="7"/>`:''}<circle cx="${x}" cy="${y}" r="16" fill="${['#80d9fa','#ab9cff','#79edcd'][i%3]}"/>`}).join('')}</svg>`;if(which==='pore')return `<svg class="heroart" viewBox="0 0 650 150" role="img" aria-label="Nanopore"><rect width="650" height="150" fill="#0a1e34"/><rect x="303" width="45" height="52" rx="7" fill="#9b9aec"/><rect x="303" y="100" width="45" height="50" rx="7" fill="#9b9aec"/><circle cx="218" cy="75" r="27" fill="#ffdb86"/><path d="M360 75 H510" stroke="#73efcf" stroke-width="3" stroke-dasharray="7 8"/><path d="M490 62 L510 75 L490 88" stroke="#73efcf" stroke-width="4" fill="none"/><g fill="#7cd1e8"><circle cx="90" cy="35" r="5"/><circle cx="120" cy="113" r="5"/><circle cx="558" cy="32" r="5"/><circle cx="580" cy="120" r="5"/></g></svg>`;return `<svg class="heroart" viewBox="0 0 650 150" role="img" aria-label="Ionic current trace"><rect width="650" height="150" fill="#0a1e34"/><path d="M0 35 H650 M0 75 H650 M0 115 H650" stroke="#234969"/><path d="M8 33 H120 V105 H210 V34 H345 V93 H442 V34 H642" fill="none" stroke="#73efcf" stroke-width="5"/></svg>`}
function choiceMarkup(o,i){let icon=typeof o==='object'&&o.icon?o.icon:null;let label=typeof o==='object'&&o.label?tx(o.label):tx(o);return `<button class="choice" data-opt="${i}" aria-pressed="false">${icon?`<span class="big" aria-hidden="true">${icon}</span>`:''}${label?`<span class="small">${escape(label)}</span>`:''}${!icon&&!label?String.fromCharCode(65+i):''}</button>`}
function render(){if(group===null)return home();if(index>=tasks[group].length)return finalPage();const s=ui(),m=tasks[group][index],g=groups.find(z=>z.id===group);selected=-1;done=false;sliderValue=m.init||0;let custom=m.type==='slider'?`<label class="meter" for="volt">${lang==='de'?'Spannung':'Voltage'} <output id="output">${sliderValue} ${m.unit}</output></label><input class="slider" id="volt" type="range" min="${m.min}" max="${m.max}" step="${m.step}" value="${sliderValue}"><div class="stats"><div>${lang==='de'?'Modellgeschwindigkeit':'Model speed'}<div class="stat" id="calc">${m.formula(sliderValue)}</div></div><div>${s.goal}<div class="stat">3–4</div></div></div>`:`<div class="choices">${m.options.map(choiceMarkup).join('')}</div>`;shell(`<div class="nav"><button class="btn alt" data-action="home">${s.back}</button><span class="chip">${g.age} · ${s.mission} ${index+1}/${tasks[group].length} · ⭐ ${score}</span><div class="progress"><div style="width:${index/tasks[group].length*100}%"></div></div></div><section class="panel"><div class="eyebrow">${s.ages[groups.findIndex(z=>z.id===group)]} · ${s.question} ${index+1}</div><h2>${tx(m.title)}</h2><p class="lead">${tx(m.q)}</p><div class="stage">${art(m.art)}${custom}</div><div class="actions"><button class="btn" data-action="check">${s.check} →</button><button class="btn alt" data-action="hint">💡 ${s.hint}</button></div><div class="feedback" id="feedback" role="status" aria-live="polite">${s.startFeedback}</div></section>`)}
function say(message,type=''){let el=app.querySelector('#feedback');if(el){el.className='feedback '+type;el.textContent=message}}
function check(){if(done)return;const s=ui(),m=tasks[group][index];if(m.type!=='slider'&&selected<0){say(s.chooseFirst,'bad');return}let good=m.type==='slider'?(sliderValue>=m.low&&sliderValue<=m.high):selected===m.answer;tries++;if(!good){say(s.retry,'bad');return}done=true;let earned=tries===1?100:60;score+=earned;let el=app.querySelector('#feedback');el.className='feedback good';el.textContent='✅ '+s.correct+' +'+earned+' '+s.points+'. '+tx(m.why);let actions=app.querySelector('.actions');actions.innerHTML=`<button class="btn" data-action="next">${index===tasks[group].length-1?s.finish:s.next}</button>`;app.querySelectorAll('[data-opt]').forEach(b=>b.disabled=true)}
function finalPage(){let s=ui();shell(`<section class="panel" style="text-align:center"><div class="celebrate">🏆 🧬 ✨</div><div class="eyebrow">${s.complete}</div><h1>${s.end}</h1><div class="stat">${score} / 600 ${s.points}</div><p class="lead" style="margin:15px auto">${s.ready}</p><div class="actions" style="justify-content:center"><button class="btn" data-action="replay">↻ ${s.again}</button><button class="btn alt" data-action="home">${s.other}</button></div></section>`)}
app.addEventListener('click',e=>{let b=e.target.closest('[data-lang],[data-age],[data-action],[data-opt]');if(!b)return;if(b.dataset.lang){if(lang!==b.dataset.lang){lang=b.dataset.lang;if(group===null)home();else if(index>=tasks[group].length)finalPage();else{let hadScore=score;render();score=hadScore}}return}if(b.dataset.age){group=b.dataset.age;index=0;tries=0;score=0;render();return}if(b.dataset.opt!==undefined){if(done)return;selected=+b.dataset.opt;app.querySelectorAll('[data-opt]').forEach(el=>{let on=+el.dataset.opt===selected;el.classList.toggle('selected',on);el.setAttribute('aria-pressed',String(on))});return}switch(b.dataset.action){case'home':home();break;case'hint':say(tx(tasks[group][index].hint));break;case'check':check();break;case'next':index++;tries=0;render();break;case'replay':index=0;tries=0;score=0;render();break}});app.addEventListener('input',e=>{if(e.target.id==='volt'){sliderValue=+e.target.value;app.querySelector('#output').textContent=sliderValue+' mV';app.querySelector('#calc').textContent=tasks[group][index].formula(sliderValue)}});home();})();
</script></body></html>
